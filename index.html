    ${f('vmNote', '비고', '', '동행, 영접 등', 'wide')}`; };
  openModal(`<h3>차량 배정 만들기</h3>
    <p class="sub">'${esc(s.name || '이름 없음')}' 연사의 항공 정보로 채웠어요. 확인하고 고친 뒤 만들면 <b>${esc(vps[0].name)}</b>의 실시간 차량 탭에 한 줄이 생겨요. 차종·기사는 차량 스케줄에서 넣어 주세요.</p>
    ${s.flight_info ? `<div class="vm-src"><b>항공 정보</b><div>${esc(s.flight_info)}</div></div>` : '<div class="alert" style="margin:0 0 10px">항공 정보가 비어 있어요. 아래 칸을 직접 채워 주세요.</div>'}
    <div class="vm-who">이 연사로 만들어요: <b>${esc(s.name || '이름 없음')}</b> · 여권 영문명 <b>${esc(s.passport_name || '(비어 있음)')}</b>
      <span>→ 영문 성·이름은 ${s.passport_name ? '여권 영문명' : '연사 이름'}에서 가져왔어요</span></div>
    <div class="role-seg big" id="vmDir"><button type="button" class="on" data-dir="arr">입국 · 공항 → 호텔</button><button type="button" data-dir="dep">출국 · 호텔 → 공항</button></div>
    <div class="vm-grid" id="vmForm">${form('arr')}</div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">취소</button><button class="btn-primary" id="vmGo">차량 배정 만들기</button></div>`);
  $('#modalRoot .modal').classList.add('wide'); pin(); setTimeout(pin, 400); setTimeout(pin, 1200);
  // 사파리 등은 '읽기 전용' 칸에는 연락처 정보를 자동으로 넣지 않음 → 누르는 순간 풀어 줌
  $('#vmForm').addEventListener('focusin', e => { if (e.target.matches('input[readonly]')) e.target.removeAttribute('readonly'); });
  $('#vmForm').addEventListener('mousedown', e => { const i = e.target.closest('input[readonly]'); if (i) i.removeAttribute('readonly'); });
  ['vmSur', 'vmGiv'].forEach(id => $('#' + id).addEventListener('input', e => { const t = e.target, u = t.value.toUpperCase(); if (u !== t.value) { const a = t.selectionStart; t.value = u; t.setSelectionRange(a, a); } }));
  $('#vmDir').addEventListener('click', e => { const b = e.target.closest('button[data-dir]'); if (!b) return;
    $$('#vmDir button').forEach(x => x.classList.toggle('on', x === b)); $('#vmForm').innerHTML = form(b.dataset.dir); pin();
    ['vmSur', 'vmGiv'].forEach(id => $('#' + id).addEventListener('input', ev => { ev.target.value = ev.target.value.toUpperCase(); })); });
  $('#vmGo').onclick = async () => {
    const v = id => ($('#' + id)?.value || '').trim();
    const d = vrParseDate(v('vmDate'), year);
    if (d === undefined) return toast('날짜는 "9월 7일" 또는 "9/7" 처럼 적어 주세요', true);
    const pax = v('vmPax'); if (pax && !/^\d{1,3}$/.test(pax)) return toast('인원은 숫자로 적어 주세요', true);
    const dir = $('#vmDir .on').dataset.dir;
    const row = { project_id: vps[0].id, speaker_id: s.id, category: 'assigned', run_date: d || null, run_time: vrTime(v('vmTime')), send_time: vrTime(v('vmSend')),
      last_name: v('vmSur').toUpperCase(), first_name: v('vmGiv').toUpperCase(), pax: pax ? Number(pax) : null, origin: v('vmFrom'), dest: v('vmTo'),
      flight: v('vmFlight').toUpperCase(), terminal: v('vmTerm'), note: v('vmNote'), position: Date.now() };
    try { localStorage.setItem('vrHotel', dir === 'arr' ? row.dest : row.origin); } catch (_) {}
    const btn = $('#vmGo'); btn.disabled = true;
    try {
      const r = await api.createVrun(row);
      closeModal(); toast(`${vps[0].name.replace(/^\[\d{4}\]\s*/, '')} 실시간 차량에 추가했어요`);
      if (S.spVr) S.spVr.push(r); const box = $('#spVrBox'); if (box) box.innerHTML = spVrHtml(s);
    } catch (e) { btn.disabled = false; /row-level|permission/i.test(e.message || '') ? toast('차량 스케줄의 편집자만 만들 수 있어요', true) : /speaker_id|vehicle_runs/.test(e.message || '') ? toast('setup/schema_v10_private_flight.sql을 먼저 실행해 주세요', true) : err(e); }
  };
}

/* =====================================================================
   이벤트
   ===================================================================== */
const ACT = {
  my: () => { leaveProject(); S.view = 'mytasks'; S.pid = null; renderSidebar(); renderMain(); loadMyWork(); },
  myOpen: el => openItem(el.dataset.table, el.dataset.id, el.dataset.pid),
  myRefresh: () => { S.my = null; renderMyWork(); },
  bell: el => bellPop(el),
  undo: () => undo(),
  trash: () => trashModal(),
  history: el => historyModal(el.dataset.table, el.dataset.id),
  spExport: () => spExport(),
  seExport: () => seExport(),
  spAttDel: el => spAttDel(el),
  edToggle: el => edToggle(el.dataset.ed),
  edAdd: () => edAddModal(),
  pageNewWin: el => { const a = document.activeElement; if (a && a.closest && a.closest('#spage')) a.blur();
    const w = window.open(`${BASE}?project=${encodeURIComponent(S.pid)}&${el.dataset.kind}=${encodeURIComponent(el.dataset.id)}&full=1`, '_blank');
    if (!w) toast('팝업이 막혔어요. 주소창 오른쪽에서 이 사이트의 팝업을 허용해 주세요', true); },
  entAdd: () => { const s = spOf(S.spId); if (!s || !canEdit()) return; const x = { id: newId(), name: '', affil: '', note: '' };
    updateSpeaker(s.id, { entourage: [...(Array.isArray(s.entourage) ? s.entourage : []), x] });
    setTimeout(() => $(`#spage .ent-row[data-entid="${x.id}"] [data-ent="name"]`)?.focus(), 60); },
  entDel: el => { const s = spOf(S.spId); if (!s || !canEdit()) return; const L = Array.isArray(s.entourage) ? s.entourage : [], x = L.find(y => y.id === el.dataset.entid);
    if (x && (x.name || x.affil || x.note) && !confirm(`'${x.name || '수행원'}'을(를) 삭제할까요?`)) return;
    updateSpeaker(s.id, { entourage: L.filter(y => y.id !== el.dataset.entid) }); },
  vrAdd: () => vrAdd(),
  spVrMake: () => spVrModal(),
  spVrOpen: el => openItem('vehicle_runs', el.dataset.id, el.dataset.pid),
  vrDel: el => vrDel(el.dataset.vid),
  vrPick: el => vrPick(el),
  vrNoteColor: el => vrNoteColor(el),
  vrPaste: () => vrPasteModal(),
  spAttDown: el => spAttDown(el),
  spAttSlotAdd: () => spAttSlotAdd(),
  spAttSlotDel: el => spAttSlotDel(el),
  cmtSend: () => cmtSend(),
  cmtDel: el => cmtDel(el.dataset.id),
  share: () => shareModal(),
  shRemove: async el => { await removeFromProject(S.pid, el.dataset.uid); if (curProject() && isMember(S.pid)) shareModal(); },
  spTab: el => { closePop(); S.stab = el.dataset.tab; renderMain(); },
  spAdd: el => spAdd(el),
  spOpen: el => openSpPage(el.dataset.sid),
  spClose: () => closeSpPage(),
  spDone: el => { const s = spOf(el.dataset.sid); if (s && canEdit()) updateSpeaker(s.id, { done: !s.done }); },
  spPick: el => spPick(el),
  spFold: el => { const v = sv(), k = Number(el.dataset.grp); v.fold = v.fold.includes(k) ? v.fold.filter(x => x !== k) : [...v.fold, k]; renderSpBody(true); },
  spFilter: el => spFilter(el),
  spSort: el => spSortPick(el),
  spSearch: () => spSearchToggle(),
  spFilterReset: () => { resetFilters(true); renderMain(); },
  spFlip: el => { const s = spOf(S.spId); if (s) updateSpeaker(s.id, { [el.dataset.f]: !s[el.dataset.f] }); },
  spSet: el => { const s = spOf(S.spId); const v = el.dataset.v === '1'; if (s && s[el.dataset.f] !== v) updateSpeaker(s.id, { [el.dataset.f]: v }); },
  spPhotoDel: () => spPhotoDel(),
  spFileOpen: el => spFileOpen(el.dataset.path),
  spFileDel: el => spFileDel(el.dataset.path),
  spDelete: () => spDelete(),
  spDel: el => spDelete(el.dataset.sid),
  spAvDay: el => { const v = sv(), d = Number(el.dataset.day); v.avDay = v.avDay === d ? 0 : d; renderSpBody(true); },
  spAvFlip: el => { const s = spOf(el.dataset.sid); if (s && canEdit()) updateSpeaker(s.id, { [el.dataset.f]: !s[el.dataset.f] }); },
  pwReset: el => pwModal(el.dataset.uid),
  delUser: el => delUserModal(el.dataset.uid),
  scAdd: () => scAdd(),
  scDel: el => scDel(el.dataset.cid),
  scPick: el => scPick(el),
  seTime: el => seTimePick(el),
  spSessOpen: async el => { const { id, pid } = el.dataset; if (!isMember(pid)) return toast('그 프로젝트에 초대받지 않아 열 수 없어요', true); await openProject(pid); if (seOf(id)) openSePage(id); },
  preAgenda: () => preAgenda(),
  sePreAgenda: el => { if (S.seId) preAgenda(S.seId, el.dataset.lang || 'en'); },
  spPdfOne: () => { if (S.spId) spPdf(S.spId); },
  spField: el => { const s = spOf(S.spId); if (!s || !canEdit()) return; const v = el.dataset.v, cur = s.fields || [];
    updateSpeaker(s.id, { fields: cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v] }); },
  spKwDel: el => { const s = spOf(S.spId); if (!s || !canEdit()) return; updateSpeaker(s.id, { keywords: (s.keywords || []).filter(x => x !== el.dataset.v) }); setTimeout(() => $('#kwIn')?.focus(), 30); },
  seCat: el => { const s = seOf(S.seId); if (!s || !canEdit()) return; const v = el.dataset.v; updateSession(s.id, { category: s.category === v ? null : v }); },
  sePub: el => { const s = seOf(S.seId); if (!s || !canEdit()) return; const v = el.dataset.v === '1'; if ((s.is_public !== false) !== v) updateSession(s.id, { is_public: v }); },
  meetType: el => meetTypePick(el),
  meetPlace: el => meetPlacePick(el),
  meetAdd: () => { const s = seOf(S.seId); if (!s || !canEdit()) return;
    const m = { id: newId(), type_id: null, day: s.day || null, time: '', title: '', place: '' };
    updateSession(s.id, { meetings: [...(s.meetings || []), m] });
    setTimeout(() => $(`#spage .meet-row[data-mid="${m.id}"] [data-mf="title"]`)?.focus(), 60); },
  meetDel: el => { const s = seOf(S.seId); if (!s || !canEdit()) return; const m = (s.meetings || []).find(x => x.id === el.dataset.mid);
    if (m && (m.title || m.place) && !confirm(`'${m.title || '기타일정'}'을(를) 삭제할까요?`)) return;
    updateSession(s.id, { meetings: (s.meetings || []).filter(x => x.id !== el.dataset.mid) }); },
  seTab: el => { closePop(); S.setab = el.dataset.tab; renderMain(); },
  seAdd: el => seAdd(el),
  seOpen: el => openSePage(el.dataset.eid),
  seDel: el => seDelete(el.dataset.eid),
  seDelete: () => seDelete(),
  sePick: el => sePick(el),
  seFilter: el => seFilter(el),
  seSort: el => seSortPick(el),
  seSearch: () => seSearchToggle(),
  seFilterReset: () => { const v = ssv(); v.day = []; v.venue = []; v.pillar = []; v.q = ''; S.pinned.clear(); renderMain(); },
  ttFull: () => openTTFull(),
  ttfClose: () => closeTTFull(),
  ttfDay: el => { ssv().tday = Number(el.dataset.day); renderTTFull(); renderSeBody(true); },
  ttPdf: () => ttPdf(),
  seTDay: el => { ssv().tday = Number(el.dataset.day); renderSeBody(true); },
  seSetDay: el => { const s = seOf(S.seId); const d = el.dataset.day ? Number(el.dataset.day) : null; if (s && s.day !== d) updateSession(s.id, { day: d }); },
  spCopy: async el => { const t = $(`#spage [data-sf="${el.dataset.f}"]`); const v = t?.value || ''; if (!v.trim()) return toast('복사할 내용이 없어요', true);
    const ok = await copyText(v); toast(ok ? '복사했어요' : '복사하지 못했어요', !ok); if (ok) { el.classList.add('done'); setTimeout(() => el.classList.remove('done'), 1200); } },
  seCopy: async el => { const t = $(`#spage [data-ef="${el.dataset.f}"]`); const v = t?.value || ''; if (!v.trim()) return toast('복사할 내용이 없어요', true);
    const ok = await copyText(v); toast(ok ? '복사했어요' : '복사하지 못했어요', !ok); if (ok) { el.classList.add('done'); setTimeout(() => el.classList.remove('done'), 1200); } },
  sePersonAdd: el => sePersonPicker(el.dataset.role),
  sePersonDel: async el => { try { await api.removeSessionPerson(el.dataset.id); S.sePeopleAll = S.sePeopleAll.filter(x => x.id !== el.dataset.id); renderSePage(); renderSeBody(); } catch (e) { err(e); } },
  sePersonOpen: el => spLinkOpen({ type:'speaker', id: el.dataset.spk, pid: el.dataset.pid }),
  seFileOpen: el => spFileOpen(el.dataset.path, 'session-files'),
  seFileDel: el => seFileDel(el.dataset.path),
  optManage: el => optManage(el.dataset.kind),
  dashKey: el => { S.dashKey = S.dashKey === el.dataset.key ? null : el.dataset.key; renderSpBody(true); },
  dashBig: el => openListPanel(el.dataset.key),
  lpBack: () => { const k = S.lpBack; closeSpPage(); if (k) openListPanel(k); },
  spLinkAdd: () => linkPicker(),
  spLinkDel: async el => { if (!confirm('이 연결을 해제할까요?')) return; try { await api.removeLink(el.dataset.id); loadLinks(); } catch (e) { err(e); } },
  spLinkOpen: el => spLinkOpen(el.dataset),
  project: el => openProject(el.dataset.pid),
  tab: el => { S.tab = el.dataset.tab; renderMain(); },
  addProject: projectModal,
  invite: inviteModal,
  access: el => accessModal(el.dataset.uid),
  removeChip: el => removeFromProject(el.dataset.pid, el.dataset.uid),
  openTask: el => openTask(el.dataset.id),
  closeDrawer,
  toggleDone: el => toggleDone(el.dataset.id),
  deleteTask: el => deleteTask(el.dataset.id),
  newDoc,
  openDoc: el => { flushDoc(); S.docId = el.dataset.id; renderMain(); },
  deleteDoc,
  closeModal: () => closeModal(),
  changePw: () => passwordModal(false),
  selectAll: () => { const all = $$('#modalRoot .sw'); const on = all.some(i => !i.checked); all.forEach(i => i.checked = on); },
  logout: () => { if (confirm('로그아웃할까요?')) api.signOut(); },
  editName: nameModal,
  togglePeople,
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.stopPropagation();
  ACT[el.dataset.act]?.(el, e);
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'loginForm') return handleLogin(e);
  const f = e.target.closest('.quick-add'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'); const title = inp.value.trim(); if (!title) return;
  const status = f.dataset.status;
  inp.disabled = true;
  try {
    await createTask(status, title);
    renderMain();
    document.querySelector(`.quick-add[data-status="${status}"] input`)?.focus();
  } catch (er) { err(er); inp.disabled = false; }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'docTitle' || t.id === 'docBody') scheduleDocSave();
  else if (t.id === 'peopleSearch') { S.search = t.value; renderPeopleList(); }
  else if (t.classList?.contains('t-title')) autosize(t);
});

document.addEventListener('change', e => {
  const f = e.target.dataset?.field;
  if (!f || !e.target.closest('#drawer')) return;
  updateTaskField($('#drawer').dataset.id, f, e.target.value);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (POP.el) closePop();
    else if ($('#modalRoot').classList.contains('open')) closeModal();
    else if ($('#spage').classList.contains('open')) closeSpPage();
    else if (S.ttFull) closeTTFull();
    else if ($('#drawer').classList.contains('open')) closeDrawer();
  }
  if (e.key === 'Enter' && e.target.classList?.contains('t-title')) { e.preventDefault(); e.target.blur(); }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'z') {
    const t = e.target;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return; // 글자 입력 중에는 원래의 ⌘Z
    if ($('#modalRoot').classList.contains('open') || S.view !== 'project' || !projTable(curProject()) || (!KIND_TABLE[curProject()?.kind] && S.tab !== 'vehicle')) return;
    e.preventDefault(); undo();
  }
});

// 문서 툴바 (선택 영역 유지를 위해 mousedown 사용)
document.addEventListener('mousedown', e => {
  const b = e.target.closest('[data-cmd]'); if (!b) return;
  e.preventDefault();
  const c = b.dataset.cmd;
  if (['h1','h2','h3','p','blockquote'].includes(c)) document.execCommand('formatBlock', false, c);
  else document.execCommand(c, false, null);
  scheduleDocSave();
});

// 보드 드래그 앤 드롭
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move';
  c.classList.add('dragging');
});
document.addEventListener('dragend', e => {
  e.target.closest?.('.card')?.classList.remove('dragging');
  $$('.col.over').forEach(x => x.classList.remove('over'));
});
document.addEventListener('dragover', e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); $$('.col.over').forEach(x => x !== z && x.classList.remove('over')); z.classList.add('over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const id = e.dataTransfer.getData('text/plain');
  if (id) updateTaskField(id, 'status', z.dataset.drop);
});

window.addEventListener('beforeunload', flushDoc);
start();
</script>
