function renderAll() { renderSidebar(); renderMain(); renderPeople(); }

function edFold() { try { return JSON.parse(localStorage.getItem('edFold') || '[]'); } catch (_) { return []; } }
function edToggle(ed) { const f = edFold(), n = f.includes(ed) ? f.filter(x => x !== ed) : [...f, ed]; try { localStorage.setItem('edFold', JSON.stringify(n)); } catch (_) {} renderSidebar(); }
function edAddModal() {
  if (!isAdmin()) return;
  const eds = [...new Set(S.projects.map(p => p.edition).filter(Boolean))].sort();
  if (!eds.length) return toast('연도가 붙은 프로젝트가 없어요. setup/schema_v14_editions.sql을 먼저 실행해 주세요', true);
  const last = eds.at(-1), next = String(Number(last) + 1);
  openModal(`<h3>연도 추가</h3>
    <p class="sub">선택한 연도의 프로젝트 세트를 복사해 새 연도 프로젝트를 만들어요.<br>
      <b>복사되는 것</b>: 프로젝트 이름([${esc(last)}] → [새 연도])·색·종류, 장소·필라·기타일정 종류·운행여부 토글<br>
      <b>복사되지 않는 것</b>: 연사·세션·대외비·차량 등 내용</p>
    <label class="lbl">새 연도</label><input type="text" id="edNew" value="${next}" maxlength="4" inputmode="numeric">
    <label class="lbl">복사할 연도 세트</label>
    <select id="edFrom" style="width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:9px">${eds.slice().reverse().map(e => `<option value="${esc(e)}">${esc(e)} (${S.projects.filter(p => p.edition === e).length}개 프로젝트)</option>`).join('')}</select>
    <label class="toggle-row" style="margin-top:14px"><span class="nm">팀원과 권한(편집자/뷰어)도 그대로 복사</span><input type="checkbox" id="edMem" checked><span class="switch"></span></label>
    <p class="hint" style="margin:8px 0 0">대외비 프로젝트도 같은 사람만 초대된 상태로 만들어져요. 끄면 관리자만 들어가 있어요.</p>
    <div class="modal-foot"><button class="btn" data-act="closeModal">취소</button><button class="btn-primary" id="edGo">만들기</button></div>`);
  $('#edGo').onclick = async () => {
    const ne = $('#edNew').value.trim(), from = $('#edFrom').value;
    if (!/^\d{4}$/.test(ne)) return toast('연도는 2028처럼 숫자 4자리로 적어 주세요', true);
    if (S.projects.some(p => p.edition === ne)) return toast('이미 있는 연도예요', true);
    const b = $('#edGo'); b.disabled = true; b.textContent = '만드는 중…';
    try {
      const n = await api.createEdition(from, ne, $('#edMem').checked);
      await reloadMeta(); closeModal(); renderAll(); toast(`${ne}년 프로젝트 ${n}개를 만들었어요`);
    } catch (e) { b.disabled = false; b.textContent = '만들기'; /create_edition|edition/i.test(e.message || '') && /exist|find/i.test(e.message || '') ? toast('setup/schema_v14_editions.sql을 먼저 실행해 주세요', true) : err(e); }
  };
}
function renderSidebar() {

  const multi = eds.length > 1 || (eds[0] ?? '') !== '';
  $('#projectList').innerHTML = (multi ? eds.map(ed => { const L = list.filter(p => (p.edition ?? '') === ed), closed = fold.includes(ed) && !L.some(p => p.id === S.pid);

  $('#navMy').classList.toggle('active', S.view === 'mytasks');

    <button class="icon-btn" data-act="logout" title="로그아웃">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3H3.5v10H6M10.5 5l3 3-3 3M13.5 8H6.5"/></svg>

const peopleBtn = `<button class="btn people-toggle" data-act="togglePeople" title="팀원 패널 열기/접기">
  <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5.5" r="2.3"/><path d="M1.8 13.2c.5-2.3 2.2-3.6 4.2-3.6s3.7 1.3 4.2 3.6"/><circle cx="11.4" cy="6.2" r="1.8"/><path d="M11.2 9.6c1.6.1 2.7 1.2 3 3"/></svg>팀원</button>`;
const isNarrow = () => window.matchMedia('(max-width:1180px)').matches;
function togglePeople() {
  if (isNarrow()) { $('#people').classList.toggle('open'); return; }
  const closed = $('#app').classList.toggle('people-closed');
  try { localStorage.setItem('peopleClosed', closed ? '1' : '0'); } catch (_) {}
}
try { if (localStorage.getItem('peopleClosed') === '1') document.getElementById('app').classList.add('people-closed'); } catch (_) {}

function renderMain() {
  flushDoc();
  const m = $('#main');
  if (S.view !== 'project' || !curProject()) return renderMyWork();
  const p = curProject();
  if (isSpeakerProject(p)) return renderSpeakerMain(p);
  if (isSessionProject(p)) return renderSessionMain(p);
  if (isSecretProject(p)) return renderSecretMain(p);
  const tab = (k, label) => `<button class="tab ${S.tab === k ? 'active' : ''}" data-act="tab" data-tab="${k}">${label}</button>`;
  const veh = isVehicleProject(p);
  if (S.tab === 'vehicle' && !veh) S.tab = 'board';
  let body = '';
  if (S.tab === 'vehicle') body = '';
  else if (S.tab === 'board') body = boardHtml();
  else if (S.tab === 'list') body = listHtml();
  else body = docsHtml();
  m.innerHTML = `<div class="ph">
      ${projectHeadHtml(p)}
      <div class="tabs">${veh ? tab('vehicle', '실시간 차량') : ''}${tab('board','보드')}${tab('list','리스트')}${tab('docs','문서')}</div>
    </div>
    ${S.tab === 'vehicle' ? `${S.vrMissing ? `<div class="alert" style="margin:12px 28px 0">실시간 차량 탭을 쓰려면 Supabase SQL Editor에서 setup/schema_v9_vehicle.sql을 먼저 실행해 주세요.</div>` : ''}<div class="content vr-content" id="vrBody"></div>` : `<div class="content">${body}</div>`}`;
  if (S.tab === 'vehicle') renderVrBody(true);
}

function projectHeadHtml(p) {
  const mem = projectMembers(p.id);
  const stack = mem.slice(0, 6).map(u => avatar(u, 26)).join('');
  const more = mem.length > 6 ? `<span class="av-more">+${mem.length - 6}</span>` : '';
  return `<div class="ph-top"><h1><span class="dot" style="background:${esc(p.color)}"></span><span class="t">${esc(p.name)}</span>${p.kind === 'secret' ? '<span class="lock-badge" title="초대받은 사람만 볼 수 있는 대외비 프로젝트">🔒 대외비</span>' : ''}</h1>
    <div class="av-stack" title="멤버 ${mem.length}명">${stack}${more}</div>
    ${myRole(p.id) === 'viewer' ? '<span class="ro-note">보기 전용</span>' : ''}
    ${projTable(p) ? `<button class="btn undo-btn ${canEdit(p.id) && S.undo.some(u => u.pid === p.id) ? '' : 'hidden'}" id="undoBtn" data-act="undo">${ICON.undo}되돌리기</button>
      <button class="btn icon-txt" data-act="trash" title="휴지통 · 삭제한 항목 복구">${ICON.trash}휴지통</button>` : ''}
    <button class="btn share-btn" data-act="share" title="참여자 보기 · 편집자/뷰어 설정 · 초대 · 링크 복사">${ICON.share}공유</button>${peopleBtn}</div>`;
}

function dueHtml(t) {
  if (!t.due_date) return '<span></span>';
  const over = t.status !== 'done' && t.due_date < todayStr();
  return `<span class="due ${over ? 'over' : ''}">${over ? '지연 · ' : ''}${fmtDate(t.due_date)}</span>`;
}

function boardHtml() {
  return `<div class="board">${STATUS.map(s => {
    const items = S.tasks.filter(t => t.status === s.k);
    return `<section class="col" data-drop="${s.k}">
      <header><span class="st st-${s.k}"></span>${s.label}<span class="cnt">${items.length}</span></header>
      <div class="cards">${items.map(cardHtml).join('')}</div>
      <form class="quick-add" data-status="${s.k}"><input placeholder="+ 작업 추가" maxlength="200"></form>
    </section>`;
  }).join('')}</div>`;
}
function cardHtml(t) {
  const a = prof(t.assignee_id);
  return `<article class="card ${t.status === 'done' ? 'is-done' : ''}" draggable="true" data-id="${t.id}" data-act="openTask">
    <div class="card-title">${t.speaker_id ? `<span class="link-badge" title="연사 마스터 '확정' 연사 · 자동 연동">${ICON.link}연사</span>` : ''}${t.priority === 'high' ? '<span class="pri">중요</span>' : ''}${esc(t.title)}</div>
    <div class="card-meta">${dueHtml(t)}${a ? avatar(a, 22) : ''}</div>
  </article>`;
}

function listHtml() {
  const order = { todo:0, doing:1, done:2 };
  const rows = [...S.tasks].sort((a, b) => order[a.status] - order[b.status] || (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  return `<div class="list-wrap">
    <form class="quick-add" data-status="todo"><input placeholder="+ 작업 추가 (Enter)" maxlength="200"></form>
    ${rows.length ? `<table><thead><tr><th style="width:40px"></th><th>작업</th><th style="width:140px">담당자</th><th style="width:120px">마감일</th><th style="width:80px">우선순위</th><th style="width:100px">상태</th></tr></thead><tbody>
    ${rows.map(t => { const a = prof(t.assignee_id); return `<tr data-act="openTask" data-id="${t.id}">
      <td><button class="check ${t.status === 'done' ? 'on' : ''}" data-act="toggleDone" data-id="${t.id}" title="완료 표시">${t.status === 'done' ? '✓' : ''}</button></td>
      <td class="${t.status === 'done' ? 'muted' : ''}" style="${t.status === 'done' ? 'text-decoration:line-through' : ''}">${t.speaker_id ? `<span class="link-badge">${ICON.link}연사</span>` : ''}${esc(t.title)}</td>
      <td>${a ? `<span class="who">${avatar(a, 22)}${esc(a.full_name || a.email)}</span>` : '<span class="muted">—</span>'}</td>
      <td>${t.due_date ? dueHtml(t) : '<span class="muted">—</span>'}</td>
      <td>${t.priority === 'high' ? '<span class="pri">중요</span>' : `<span class="muted">${PRIORITY[t.priority]}</span>`}</td>
      <td><span class="pill"><span class="st st-${t.status}"></span>${STATUS_LABEL[t.status]}</span></td>
    </tr>`; }).join('')}</tbody></table>` : '<div class="empty">아직 작업이 없어요. 위에 입력해서 첫 작업을 만들어 보세요.</div>'}
  </div>`;
}

function docsHtml() {
  let d = S.docs.find(x => x.id === S.docId) || S.docs[0];
  S.docId = d?.id || null;
  const list = S.docs.map(x => `<button class="doc-item ${x.id === S.docId ? 'active' : ''}" data-act="openDoc" data-id="${x.id}">${esc(x.title || '제목 없음')}</button>`).join('');
  const tb = [['h1','제목1'],['h2','제목2'],['p','본문'],['bold','<b>B</b>'],['italic','<i>I</i>'],['strikeThrough','<s>S</s>'],['insertUnorderedList','• 목록'],['insertOrderedList','1. 목록'],['blockquote','인용']]
    .map(([c, l]) => `<button type="button" data-cmd="${c}">${l}</button>`).join('');
  return `<div class="docs">
    <div class="doc-list"><button class="btn" data-act="newDoc">+ 새 문서</button>${list || '<div class="empty-sm">문서가 없어요</div>'}</div>
    <div class="doc-editor">${d ? `
      <div class="doc-toolbar">${tb}</div>
      <input class="doc-title" id="docTitle" value="${esc(d.title)}" placeholder="제목 없음" maxlength="200">
      <div class="doc-body" id="docBody" contenteditable="true" data-placeholder="회의록, 진행 메모, 가이드 등을 자유롭게 적어 보세요…">${DOMPurify.sanitize(d.content || '')}</div>
      <div class="doc-foot"><span id="docSaved">저장됨</span><button class="btn-danger" data-act="deleteDoc" style="padding:4px 8px">문서 삭제</button></div>`
      : '<div class="empty">왼쪽의 <b>+ 새 문서</b>로 회의록이나 가이드를 만들어 보세요.</div>'}
    </div></div>`;
}

/* ---------- 오른쪽 팀원 패널 ---------- */
function renderPeople() {

let unsubRT = null;
function leaveProject() {
  flushDoc(); closePop(); closeSpPage(); closeDrawer(); if (S.ttFull) closeTTFull();
  if (unsubRT) { try { unsubRT(); } catch (_) {} unsubRT = null; }
}
async function openProject(pid) {
  leaveProject();
  S.view = 'project'; S.pid = pid; S.docId = null; S.pinned = new Set();
  renderSidebar();
  $('#main').innerHTML = '<div class="loading">불러오는 중…</div>';
  $('#people').classList.remove('open');
  if (isSpeakerProject(curProject())) {
    try { S.speakers = await api.speakers(pid); } catch (e) { S.speakers = []; err(e); }
    await loadSpPriv(pid);
    S.evInfo = []; S.spSessDash = null;
    api.eventInfo(pid).then(r => { if (S.pid === pid) { S.evInfo = r; if (S.stab === 'dash') renderSpBody(); } }).catch(() => { S.evInfoMissing = true; });
    if (S.pid !== pid) return;
    try { unsubRT = api.subscribe(pid, onRealtime); } catch (e) { console.error(e); }
  } else if (isSecretProject(curProject())) {
    try { S.secret = await api.secretItems(pid); } catch (e) { S.secret = []; err(e); }
    if (S.pid !== pid) return;
    try { unsubRT = api.subscribe(pid, onRealtime); } catch (e) { console.error(e); }
  } else if (isSessionProject(curProject())) {
    try { [S.sessions, S.venues, S.pillars] = await Promise.all([api.sessions(pid), api.opts('session_venues', pid), api.opts('session_pillars', pid)]); }
    catch (e) { S.sessions = []; S.venues = []; S.pillars = []; err(e); }
    try { S.meetTypes = sortOpts(await api.opts('session_meet_types', pid)); } catch (e) { S.meetTypes = []; console.warn('session_meet_types', e); }
    if (S.pid !== pid) return;
    S.sePeopleAll = []; S.spkNames = {};
    loadSePeople();
    try { unsubRT = api.subscribe(pid, onRealtime); } catch (e) { console.error(e); }
  } else {
    const veh = isVehicleProject(curProject());
    if (veh) S.tab = 'vehicle'; else if (S.tab === 'vehicle') S.tab = 'board';
    try { [S.tasks, S.docs] = await Promise.all([api.tasks(pid), api.docs(pid), veh ? loadVehicle(pid) : null]); }
    catch (e) { S.tasks = []; S.docs = []; err(e); }
    if (S.pid !== pid) return;
    try { unsubRT = api.subscribe(pid, onRealtime); } catch (e) { console.error(e); }
  }
  if (S.pid === pid) renderMain();
}

async function createTask(status, title) {
  const t = await api.createTask({ project_id: S.pid, title, status, position: Date.now() });
  S.tasks.push(t);
}

async function updateTaskField(id, field, value) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  let v = value;
  if (field === 'title') { v = String(v).trim(); if (!v) { toast('작업 이름은 비워 둘 수 없어요', true); return openTask(id); } }
  if (field === 'assignee_id' || field === 'due_date') v = v || null;
  if (t[field] === v) return;
  try {
    const u = await api.updateTask(id, { [field]: v });
    Object.assign(t, u);
    renderMain();
    if ($('#drawer').classList.contains('open') && $('#drawer').dataset.id === id && (field === 'status')) openTask(id);
  } catch (e) { err(e); }
}

  if (t.assignee_id && !mem.some(m => m.id === t.assignee_id) && prof(t.assignee_id)) mem.push(prof(t.assignee_id));

      <label>담당자</label><select data-field="assignee_id"><option value="">담당자 없음</option>${mem.map(u => `<option value="${u.id}" ${t.assignee_id === u.id ? 'selected' : ''}>${esc(u.full_name || u.email)}</option>`).join('')}</select>

    </div>

    <div class="t-meta">${creator ? esc(creator.full_name || creator.email) + ' 님이 만듦 · ' : ''}${fmtDT(t.created_at)}${t.updated_at ? ' · 마지막 수정 ' + fmtDT(t.updated_at) : ''}</div>

function closeDrawer() {
  const a = document.activeElement; if (a && a.closest('#drawer')) a.blur(); // 편집 중인 내용 저장

}
function autosize(el) { if (!el) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

async function toggleDone(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  await updateTaskField(id, 'status', t.status === 'done' ? 'todo' : 'done');
}
async function deleteTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (!confirm(`'${t.title}' 작업을 삭제할까요?`)) return;
  try { await api.deleteTask(id); S.tasks = S.tasks.filter(x => x.id !== id); closeDrawer(); renderMain(); toast('작업을 삭제했어요'); }

function scheduleDocSave() { const s = $('#docSaved'); if (s) s.textContent = '저장 중…'; clearTimeout(docTimer); docTimer = setTimeout(flushDoc, 700); }
function flushDoc() {
  if (!docTimer) return;
  clearTimeout(docTimer); docTimer = null;
  const d = S.docs.find(x => x.id === S.docId);
  if (!d || !$('#docBody')) return;
  const patch = { title: $('#docTitle').value.trim() || '제목 없음', content: DOMPurify.sanitize($('#docBody').innerHTML) };

  const item = document.querySelector(`.doc-item[data-id="${d.id}"]`); if (item) item.textContent = patch.title;

}

const toggleRow = (p, on) => `<label class="toggle-row"><span class="dot" style="background:${esc(p.color)}"></span><span class="nm">${esc(p.name)}</span><input type="checkbox" class="sw" value="${p.id}" ${on ? 'checked' : ''}><span class="switch"></span></label>`;
const checkedIds = () => $$('#modalRoot .sw:checked').map(i => i.value);

function inviteModal() {
  if (!isAdmin()) return;
  openModal(`<h3>팀원 초대</h3>
    <p class="sub">초대 메일을 받은 사람은 아래에서 켠 프로젝트만 볼 수 있어요. 이미 가입한 팀원이면 메일 없이 권한만 추가돼요.</p>
    <label class="lbl">이메일</label>
    <textarea id="invEmails" rows="2" placeholder="name@company.com (여러 명은 쉼표나 줄바꿈으로 구분)"></textarea>
    <label class="lbl" style="display:flex;justify-content:space-between">
      <span>참여할 프로젝트<span class="hint">중복 선택 가능</span></span>
      <button type="button" class="sel-all" data-act="selectAll">모두 선택</button></label>
    <div class="toggles">${S.projects.map(p => toggleRow(p, false)).join('')}</div>
    <label class="lbl">권한</label>
    <div class="role-seg big" id="invRole"><button type="button" class="on" data-role="editor">편집자 · 보고 고치기</button><button type="button" data-role="viewer">뷰어 · 보기만</button></div>
    <div id="invResult"></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">취소</button><button class="btn-primary" id="invSend">초대 보내기</button></div>`);
  $('#invRole').addEventListener('click', e => { const b = e.target.closest('button[data-role]'); if (!b) return; $$('#invRole button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#invSend').onclick = async () => {
    if (!onWeb()) return toast(FILE_WARN, true);
    const role = $('#invRole .on')?.dataset.role || 'editor';
    const emails = [...new Set($('#invEmails').value.split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(Boolean))];
    const pids = checkedIds();
    if (!emails.length) return toast('이메일을 입력하세요', true);
    const bad = emails.find(x => !EMAIL_RE.test(x)); if (bad) return toast(`이메일 형식을 확인하세요: ${bad}`, true);
    if (!pids.length) return toast('프로젝트를 하나 이상 켜 주세요', true);
    const btn = $('#invSend'); btn.disabled = true; btn.textContent = '보내는 중…';
    const fails = []; let sent = 0, added = 0;
    for (const em of emails) {
      try { const r = await api.invite(em, pids, role); r?.existing ? added++ : sent++; }
      catch (e) { fails.push(`${em} — ${e.message}`); }
    }
    try { await reloadMeta(); renderSidebar(); renderPeople(); } catch (e) { err(e); }
    const summary = [sent && `${sent}명에게 초대 메일 발송`, added && `${added}명 권한 추가`].filter(Boolean).join(', ');
    if (fails.length) {
      $('#invResult').innerHTML = `<div class="alert">${fails.map(esc).join('<br>')}</div>`;
      btn.disabled = false; btn.textContent = '다시 시도';
      if (summary) toast(summary);
    } else { closeModal(); toast(summary || '완료'); }
  };
}

// 비밀번호 초기화 창: ① 재설정 메일 ② 임시 비밀번호 직접 정하기 (둘 다 프로젝트 초대·권한은 그대로)
// 임시 비밀번호: 소문자 4 + 숫자 4 + 소문자 2 (대소문자·헷갈리는 글자 l/o/i/0/1 없음 → 불러 줘도 틀리지 않게)
function genTempPw() {
  const L = 'abcdefghjkmnpqrstuvwxyz', D = '23456789', r = new Uint32Array(10); crypto.getRandomValues(r);
  return [...r].map((n, i) => (i >= 4 && i < 8 ? D : L)[n % (i >= 4 && i < 8 ? D.length : L.length)]).join('');
}

  openModal(`<h3>비밀번호 초기화</h3>

    <div class="pw-opt">
      <div class="pw-opt-h"><b>① 재설정 메일 보내기</b><button type="button" class="btn" id="pwMailBtn">메일 보내기</button></div>
      <div class="hint">받은 사람이 메일의 링크를 눌러 새 비밀번호를 직접 정해요.</div>
    </div>
    <div class="pw-opt">
      <div class="pw-opt-h"><b>② 임시 비밀번호 직접 정하기</b></div>
      <div class="hint">메일 없이 바로 바뀌어요. 임시 비밀번호를 본인에게 직접 알려 주세요. 그 비밀번호로 처음 로그인하면 새 비밀번호를 정하는 창이 떠요.</div>
      <div class="pw-temp"><input type="text" id="tmpPw" value="${genTempPw()}" maxlength="72" autocomplete="off" spellcheck="false">
        <button type="button" class="icon-btn" id="tmpGen" title="다시 만들기">↻</button>
        <button type="button" class="btn" id="tmpCopy">${ICON.copy}복사</button>
        <button type="button" class="btn-primary" id="tmpSet">설정</button></div>
      <div id="tmpResult"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">닫기</button></div>`);
  $('#pwMailBtn').onclick = () => sendPwReset(uid, $('#pwMailBtn'), true);
  $('#tmpGen').onclick = () => { $('#tmpPw').value = genTempPw(); };
  $('#tmpCopy').onclick = async () => { const ok = await copyText($('#tmpPw').value); toast(ok ? '임시 비밀번호를 복사했어요' : '복사하지 못했어요', !ok); };
  $('#tmpSet').onclick = async () => {
    const pw = $('#tmpPw').value.trim(), btn = $('#tmpSet');
    if (pw.length < 8) return toast('임시 비밀번호는 8자 이상으로 정해 주세요', true);
    if (!confirm(`${p.full_name || p.email} 님의 비밀번호를 지금 바로 바꿀까요?\n지금 쓰던 비밀번호로는 더 이상 로그인할 수 없어요.`)) return;
    btn.disabled = true; btn.textContent = '설정 중…';
    try {
      const r = await api.adminSetPassword(uid, pw);
      btn.textContent = '✓ 설정됨';
      const em = r?.email || p.email;
      $('#tmpResult').innerHTML = `<div class="ok-box">${r?.verified ? '✓ 설정하고 <b>로그인 확인까지</b> 마쳤어요.' : '설정했어요.'} 아래 그대로 본인에게 알려 주세요.<br>
        이메일 <b>${esc(em)}</b> · 임시 비밀번호 <code>${esc(pw)}</code><br>처음 로그인하면 새 비밀번호를 정하게 돼요.
        ${em.toLowerCase() !== String(p.email).toLowerCase() ? `<br><b style="color:var(--danger)">※ 로그인 이메일이 팀원 목록(${esc(p.email)})과 달라요. 위 이메일로 로그인해야 해요.</b>` : ''}</div>`;
      toast('임시 비밀번호를 설정했어요');
    } catch (e) { btn.disabled = false; btn.textContent = '설정'; err(e); }
  };
  if (focus === 'temp') setTimeout(() => $('#tmpPw')?.select(), 60);
}

// 비밀번호 재설정 메일 (계정·프로젝트 초대·권한은 그대로, 비밀번호만 새로 정하게 함)
async function sendPwReset(uid, btn, skipConfirm) {
  const p = prof(uid); if (!p || !isAdmin()) return;
  if (!onWeb()) return toast(FILE_WARN, true);
  if (!skipConfirm && !confirm(`${p.full_name || p.email} 님에게 비밀번호 재설정 메일을 보낼까요?\n\n프로젝트 초대와 권한은 그대로 유지되고, 메일의 링크로 새 비밀번호만 정하게 돼요.`)) return;
  const label = btn?.textContent; if (btn) { btn.disabled = true; if (skipConfirm) btn.textContent = '보내는 중…'; }
  try {
    await api.sendReset(p.email);
    if (btn && skipConfirm) btn.textContent = '✓ 보냈어요';
    toast(`${p.email} 으로 비밀번호 재설정 메일을 보냈어요`);
  } catch (e) {
    if (btn && skipConfirm) btn.textContent = label;
    toast(/rate|security purposes|seconds/i.test(e.message || '') ? '같은 사람에게는 1분쯤 지나서 다시 보낼 수 있어요' : (e.message || '보내지 못했어요'), true);
  } finally { if (btn && !skipConfirm) btn.disabled = false; else if (btn && btn.textContent !== '✓ 보냈어요') btn.disabled = false; }
}

function accessModal(uid) {
  if (!isAdmin()) return;
  const p = prof(uid); if (!p) return;
  const roleOf = pid => S.members.find(m => m.project_id === pid && m.user_id === uid)?.role || 'editor';
  const cur = new Set(S.members.filter(m => m.user_id === uid).map(m => m.project_id));
  const st = Object.fromEntries(S.projects.map(pr => [pr.id, { on: cur.has(pr.id), role: cur.has(pr.id) ? roleOf(pr.id) : 'editor' }]));
  const seg = (pid, role) => `<div class="role-seg mini" data-pid="${pid}"><button type="button" class="${role === 'editor' ? 'on' : ''}" data-role="editor">편집자</button><button type="button" class="${role === 'viewer' ? 'on' : ''}" data-role="viewer">뷰어</button></div>`;
  openModal(`<h3>팀원 권한</h3>
    <div class="person mini">${avatar(p, 34)}<div class="pinfo"><div class="pname">${esc(p.full_name || p.email)}</div><div class="pemail">${esc(p.email)}</div></div></div>
    <div class="ws-role">
      <div><b>워크스페이스 전체 권한</b><div class="hint" id="wsNote"></div></div>
      <div class="role-seg big" id="wsRole"><button type="button" data-role="editor">모두 편집자</button><button type="button" data-role="viewer">모두 뷰어</button></div>
    </div>
    <label class="lbl">프로젝트별 참여 · 권한</label>
    <div class="toggles">${S.projects.map(pr => `<div class="acc-row" data-pid="${pr.id}">${toggleRow(pr, st[pr.id].on)}${seg(pr.id, st[pr.id].role)}</div>`).join('')}</div>
    <p class="sub" style="margin-top:10px">편집자는 보고 고칠 수 있고, 뷰어는 보기만 해요. 끈 프로젝트는 볼 수 없어요. <b>저장</b>을 눌러야 반영돼요.</p>
    <div class="pw-mail"><div><b>관리자 ${p.role === 'admin' ? '<span class="badge">지금 관리자</span>' : ''}</b><div class="hint">관리자는 팀원 초대·권한 변경·삭제, 비밀번호 초기화, 연도 추가를 할 수 있어요. 대외비 내용은 관리자라도 초대받아야 보여요.</div></div>
      <button type="button" class="btn" id="accAdmin">${p.role === 'admin' ? '관리자 해제' : '관리자로 지정'}</button></div>
    ${uid !== S.me.id ? `<div class="pw-mail"><div><b>비밀번호 재설정</b><div class="hint">비밀번호를 잊었거나 초대 링크가 만료됐을 때 써요. 프로젝트 초대·권한은 그대로 유지돼요.</div></div>
      <div class="pw-btns"><button type="button" class="btn" id="accPwMail">메일 보내기</button><button type="button" class="btn" id="accPwTemp">임시 비밀번호</button></div></div>` : ''}
    ${uid !== S.me.id ? `<div class="pw-mail danger-zone"><div><b>팀원 삭제</b><div class="hint">워크스페이스에서 완전히 내보내요. 로그인 계정과 모든 프로젝트 초대가 지워지고, 이 사람이 만든 연사·세션 데이터는 그대로 남아요.</div></div>
      <button type="button" class="btn-danger" data-act="delUser" data-uid="${uid}">삭제</button></div>` : ''}
    <div class="modal-foot"><button class="btn" data-act="closeModal">취소</button><button class="btn-primary" id="accSave">저장</button></div>`);
  $('#accAdmin').onclick = async () => {
    const make = p.role !== 'admin', who = p.full_name || p.email;
    if (!confirm(make ? `${who} 님을 관리자로 지정할까요?\n팀원 초대·권한 변경·삭제를 할 수 있게 돼요.` : uid === S.me.id ? '내 관리자 권한을 해제할까요?\n해제하면 다른 관리자만 다시 지정해 줄 수 있어요.' : `${who} 님의 관리자 권한을 해제할까요?`)) return;
    const b = $('#accAdmin'); b.disabled = true;
    try {
      await api.setAdmin(uid, make); await reloadMeta(); renderAll();
      toast(make ? `${who} 님을 관리자로 지정했어요` : `${who} 님의 관리자 권한을 해제했어요`);
      if (isAdmin()) accessModal(uid); else closeModal();
    } catch (e) { b.disabled = false; /set_admin|could not find|schema cache/i.test(e.message || '') ? toast('setup/schema_v15_admin_role.sql을 먼저 실행해 주세요', true) : err(e); }
  };
  const draw = () => {
    S.projects.forEach(pr => {
      const row = $(`#modalRoot .acc-row[data-pid="${pr.id}"]`); if (!row) return;
      row.classList.toggle('off', !st[pr.id].on);
      $$('.role-seg button', row).forEach(b => b.classList.toggle('on', b.dataset.role === st[pr.id].role));
    });
    const on = Object.values(st).filter(x => x.on);
    const all = !on.length ? '' : on.every(x => x.role === 'editor') ? 'editor' : on.every(x => x.role === 'viewer') ? 'viewer' : 'mixed';
    $$('#wsRole button').forEach(b => b.classList.toggle('on', b.dataset.role === all));
    $('#wsNote').textContent = !on.length ? '참여 중인 프로젝트가 없어요' : all === 'mixed' ? '프로젝트마다 다르게 설정돼 있어요' : `참여 중인 프로젝트 ${on.length}개 모두 ${all === 'viewer' ? '뷰어' : '편집자'}`;
  };
  draw();
  $('#modalRoot .toggles').addEventListener('change', e => { const sw = e.target.closest('.sw'); if (sw) { st[sw.value].on = sw.checked; draw(); } });
  $('#modalRoot .toggles').addEventListener('click', e => { const b = e.target.closest('.role-seg button'); if (!b) return; const pid = b.closest('.role-seg').dataset.pid; st[pid].role = b.dataset.role; if (!st[pid].on) { st[pid].on = true; $(`#modalRoot .sw[value="${pid}"]`).checked = true; } draw(); });
  $('#wsRole').addEventListener('click', e => { const b = e.target.closest('button[data-role]'); if (!b) return; Object.values(st).forEach(x => { if (x.on) x.role = b.dataset.role; }); draw(); });
  const pwBtn = $('#accPwMail'); if (pwBtn) pwBtn.onclick = () => sendPwReset(uid, pwBtn, true);
  const tmpBtn = $('#accPwTemp'); if (tmpBtn) tmpBtn.onclick = () => pwModal(uid, 'temp');
  $('#accSave').onclick = async () => {
    const ids = Object.keys(st);
    const add = ids.filter(id => st[id].on && !cur.has(id)), rem = ids.filter(id => !st[id].on && cur.has(id));
    const chg = ids.filter(id => st[id].on && cur.has(id) && st[id].role !== roleOf(id));
    if (!add.length && !rem.length && !chg.length) return closeModal();
    $('#accSave').disabled = true;
    try {
      await Promise.all([...add.map(pid => api.addMember(pid, uid, st[pid].role)), ...rem.map(pid => api.removeMember(pid, uid)), ...chg.map(pid => api.setMemberRole(pid, uid, st[pid].role))]);
      closeModal(); await afterMembershipChange(); toast('권한을 저장했어요');
    } catch (e) { err(e); $('#accSave').disabled = false; }
  };
}

async function removeFromProject(pid, uid) {
  const p = prof(uid), pr = S.projects.find(x => x.id === pid);
  if (!p || !pr) return;
  if (!confirm(`${p.full_name || p.email} 님을 '${pr.name}'에서 제외할까요?\n제외하면 이 프로젝트의 내용을 볼 수 없어요.`)) return;
  try { await api.removeMember(pid, uid); await afterMembershipChange(); toast('프로젝트에서 제외했어요'); }
  catch (e) { err(e); }
}

async function afterMembershipChange() {
  await reloadMeta();
  if (S.view === 'project' && !isMember(S.pid)) { S.view = 'mytasks'; S.pid = null; closeDrawer(); }
  renderAll();
}

// 생년월일 → YYYY-MM-DD 로 고정 (19680412, 1968.4.12, 1968/04/12, 1968년 4월 12일 모두 받아서 변환)
function normBirth(v) {
  const t = String(v).trim();
  const m = t.match(/^(\d{4})\s*[.\-\/년\s]\s*(\d{1,2})\s*[.\-\/월\s]\s*(\d{1,2})\s*일?\.?$/) || t.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3], dt = new Date(y, mo - 1, d);
  if (y < 1900 || y > new Date().getFullYear() || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
const editionOf = pid => S.projects.find(p => p.id === pid)?.edition ?? null;
const sameEdition = p => (p.edition ?? null) === editionOf(S.pid);
const syncNames = () => S.projects.filter(p => p.sync_confirmed && sameEdition(p)).map(p => p.name.replace(/^\[\d{4}\]\s*/, '')).join('·');
const myRole = (pid = S.pid) => { const m = S.members.find(x => x.project_id === pid && x.user_id === S.me?.id); return m ? (m.role || 'editor') : null; };

const norm = s => String(s ?? '').normalize('NFC').toLowerCase().replace(/\s+/g, '');
const pname = id => { const p = prof(id); return p ? (p.full_name || p.email) : ''; };
const projName = pid => S.projects.find(p => p.id === pid)?.name || '다른 프로젝트';

function sv() { return (S.svs[S.pid] ||= { nat:[], ev:[], diet:false, asg:[], sort:'manual', q:'', fold:[] }); }
const filterCount = () => { const v = sv(); return v.nat.length + v.ev.length + (v.diet ? 1 : 0) + v.asg.length; };
function resetFilters(withSearch) { const v = sv(); v.nat = []; v.ev = []; v.diet = false; v.asg = []; if (withSearch) v.q = ''; S.pinned.clear(); }

function spVisible() {
  const v = sv(), q = norm(v.q);
  return S.speakers.filter(s => {
    if (S.pinned.has(s.id)) return true;
    if (q && ![s.name, s.passport_name, ...(s.keywords || []), ...(s.fields || []), s.affil_en, s.affil_ko, s.title_en, s.title_ko].some(x => norm(x).includes(q))) return false;
    if (v.nat.length && !v.nat.includes(s.nationality_id)) return false;
    if (v.ev.some(f => !s[f])) return false;
    if (v.diet && !s.diet_flag) return false;
    if (v.asg.length && !(s.assignees || []).some(a => v.asg.includes(a))) return false;
    return true;
  });
}
function spSort(list) {
  const k = sv().sort, a = [...list];
  const cmpName = (x, y) => !x.name ? (y.name ? 1 : 0) : !y.name ? -1 : x.name.localeCompare(y.name, 'en', { numeric:true, sensitivity:'base' });
  if (k === 'alpha') a.sort(cmpName);
  else if (k === 'assignee') a.sort((x, y) => { const ax = pname(x.assignees?.[0]), ay = pname(y.assignees?.[0]);
    return (!ax && ay) ? 1 : (ax && !ay) ? -1 : (ax.localeCompare(ay, 'ko') || cmpName(x, y)); });
  else if (k === 'created') a.sort((x, y) => String(y.created_at).localeCompare(String(x.created_at)));
  else if (k === 'updated') a.sort((x, y) => String(y.updated_at).localeCompare(String(x.updated_at)));

}

    : t === 'ev' ? s => !!s[v] : t === 'diet' ? s => s.diet_flag : t === 'day' ? s => !!s['day' + v] : () => false;
  return all.filter(f).sort((a, b) => (a.name || '￿').localeCompare(b.name || '￿', 'en', { sensitivity:'base' }));

function spRefresh(from) {

async function updateSpeaker(id, patch, from, opt = {}) {
  const s = spOf(id); if (!s) return;
  const prev = {}; for (const k in patch) prev[k] = s[k];
  if (!opt.noUndo) pushUndo({ type:'update', table:'speakers', id, prev: JSON.parse(JSON.stringify(prev)), label: s.name || '이름 없음' });
  Object.assign(s, patch, { updated_at: new Date().toISOString() });
  spRefresh(from);
  try {
    const pub = { ...patch }, pv = {}; PRIV_KEYS.forEach(k => { if (k in pub) { pv[k] = pub[k] ?? ''; delete pub[k]; } });
    if (Object.keys(pv).length) await api.savePrivate(id, s.project_id, pv);
    const row = Object.keys(pub).length ? await api.updateSpeaker(id, pub) : null; const cur = spOf(id); if (cur && row?.updated_at) cur.updated_at = row.updated_at;
    if ('grp' in patch && (patch.grp === 3) !== (prev.grp === 3) && S.projects.some(p => p.sync_confirmed && sameEdition(p)))
      toast(patch.grp === 3 ? `'${s.name || '이름 없음'}' 확정 → ${syncNames()}에 자동으로 추가했어요` : `'${s.name || '이름 없음'}' 확정 해제 → ${syncNames()}에서 뺐어요`);
    return true; }
  catch (e) { const cur = spOf(id); if (cur) Object.assign(cur, prev); if (!opt.noUndo) { S.undo.pop(); updateUndoBtn(); } spRefresh(); err(e); return false; }
}
async function spAdd(el) {
  if (!canEdit()) return;
  const field = el?.dataset?.field, raw = el?.dataset?.val;
  const init = { project_id: S.pid, name: '', grp: 1, position: Date.now() };
  if (field) init[field] = field === 'grp' ? Number(raw) : raw;
  try {
    const s = await api.createSpeaker(init);
    if (!spOf(s.id)) S.speakers.push(s);

}
async function addNationality(name) {
  const exist = S.nats.find(n => norm(n.name) === norm(name)); if (exist) return exist;
  try {
    const n = await api.addNationality(name, NAT_COLORS[S.nats.length % NAT_COLORS.length], Math.max(0, ...S.nats.map(x => x.sort_order || 0)) + 1);

/* ---------- 팝오버 (토글 선택) ---------- */
const POP = { el:null, anchor:null };
function closePop() { POP.el?.remove(); POP.el = null; POP.anchor = null; }
function openPop(anchor, build) {
  if (POP.anchor === anchor) { closePop(); return; }
  closePop();
  const el = document.createElement('div'); el.className = 'pop';
  document.body.appendChild(el);
  POP.el = el; POP.anchor = anchor; POP.at = Date.now();
  build(el); placePop();
}
function placePop() {
  const el = POP.el, a = POP.anchor; if (!el || !a || !a.isConnected) return;
  const r = a.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  let top = r.bottom + 4; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
document.addEventListener('mousedown', e => {
  if (POP.el && !POP.el.contains(e.target) && !(POP.anchor && POP.anchor.contains(e.target))) closePop();
}, true);
window.addEventListener('resize', closePop);
// 누른 칸이 화면 안으로 자동 스크롤될 때는 닫지 않고 위치만 다시 맞춤
document.addEventListener('scroll', e => {
  if (!POP.el || POP.el.contains(e.target)) return;
  if (Date.now() - (POP.at || 0) < 500) placePop(); else closePop();
}, true);

function pickList(anchor, { options, value, multi, onPick, searchable, onCreate, title, footer }) {
  const sel = multi ? new Set(value || []) : value;
  let q = '';
  openPop(anchor, el => {
    el.innerHTML = `${title ? `<div class="pop-h">${title}</div>` : ''}${searchable ? `<input class="pop-search" placeholder="${onCreate ? '검색 또는 새로 추가…' : '검색…'}">` : ''}<div class="pop-list"></div>${footer ? `<button type="button" class="pop-foot">${footer.label}</button>` : ''}`;
    const list = el.querySelector('.pop-list');
    if (footer) el.querySelector('.pop-foot').addEventListener('click', () => { closePop(); footer.onClick(); });
    const draw = () => {
      const nq = norm(q);
      const shown = options.filter(o => !nq || norm(o.text).includes(nq));
      let html = shown.map(o => `<button type="button" class="pop-opt ${(multi ? sel.has(o.v) : sel === o.v) ? 'sel' : ''}" data-v="${esc(String(o.v))}">${o.html}<span class="ck">✓</span></button>`).join('');
      if (onCreate && q.trim() && !options.some(o => norm(o.text) === nq)) html += `<button type="button" class="pop-opt pop-create" data-create="1">+ <b>${esc(q.trim())}</b> 새로 추가</button>`;
      list.innerHTML = html || '<div class="pop-empty">결과 없음</div>';
    };
    draw();
    list.addEventListener('click', async e => {
      const b = e.target.closest('.pop-opt'); if (!b) return;
      if (b.dataset.create) { await onCreate(q.trim()); return; }
      const o = options.find(x => String(x.v) === b.dataset.v); if (!o) return;
      if (multi) { sel.has(o.v) ? sel.delete(o.v) : sel.add(o.v); draw(); onPick([...sel]); }
      else { closePop(); if (o.v !== value) onPick(o.v); }
    });
    const inp = el.querySelector('.pop-search');
    if (inp) {
      setTimeout(() => inp.focus(), 0);
      inp.addEventListener('input', () => { q = inp.value; draw(); placePop(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); list.querySelector('.pop-opt')?.click(); } });
    }
  });
}
function spPick(el) {
  const s = spOf(el.dataset.sid); if (!s || !canEdit()) return;
  const f = el.dataset.field;
  const set = v => updateSpeaker(s.id, { [f]: v });
  if (f === 'assignees') {
    const mem = projectMembers(S.pid);
    pickList(el, { multi:true, value:s.assignees || [], title:'담당자 · 여러 명 선택 가능', searchable: mem.length > 6,
      options: mem.map(p => ({ v:p.id, text:(p.full_name || '') + ' ' + p.email, html:`${avatar(p, 22)}<span>${esc(p.full_name || p.email)}</span>` })),
      onPick: set });
  } else if (f === 'nationality_id') {
    pickList(el, { value:s.nationality_id ?? null, searchable:true, title:'국적',
      options: [{ v:null, text:'', html:'<span class="tg-empty">선택 안 함</span>' }, ...S.nats.map(n => ({ v:n.id, text:n.name, html:natTag(n) }))],
      onPick: set,
      onCreate: async name => { const n = await addNationality(name); if (n) { closePop(); set(n.id); } } });
  } else {
    const list = f === 'flight_status' ? FLIGHT : f === 'hotel_status' ? HOTEL : f === 'grp' ? GROUPS : PRI;
    const opts = list.map(o => ({ v:o.k, text:o.label, html:(f === 'grp' ? `<span class="gnum">${o.k}</span>` : '') + tag(o.tone, o.label) }));
    if (f === 'priority') opts.unshift({ v:null, text:'', html:'<span class="tg-empty">선택 안 함</span>' });

function linksHtml() {

}
async function loadLinks() {
  const sid = S.spId; if (!sid) return;
  try {
    const links = await api.links(sid);
    const ids = { speaker: links.filter(l => l.target_type === 'speaker').map(l => l.target_id), task: links.filter(l => l.target_type === 'task').map(l => l.target_id) };
    const targets = await api.resolveTargets(ids);
    if (S.spId !== sid) return;
    S.spLinks = links; S.spLinksLoaded = true;
    S.spTargets = Object.fromEntries(targets.map(t => [t.type + ':' + t.id, t]));
  } catch (e) { console.error(e); S.spLinksLoaded = true; }
  const box = $('#spLinks'); if (box) box.innerHTML = linksHtml();
  try { const r = await api.speakerSessions(sid); if (S.spId === sid) S.spSess = r; } catch (_) { if (S.spId === sid) S.spSess = []; }
  const b2 = $('#spSess'); if (b2) b2.innerHTML = spSessHtml();
}

const URLC = new Map();
async function fileUrl(path, bucket = 'speaker-files') {
  const key = bucket + '/' + path, c = URLC.get(key); if (c && c.exp > Date.now()) return c.url;
  const url = await api.fileUrl(path, bucket); URLC.set(key, { url, exp: Date.now() + 50 * 60 * 1000 }); return url;
}
function hydrateFiles(root) {
  $$('img[data-fpath]', root).forEach(async img => { try { img.src = await fileUrl(img.dataset.fpath); } catch (_) { img.alt = '사진을 불러오지 못했어요'; } });
}
async function uploadPhoto(sid, file) {
  const s = spOf(sid); if (!s || !file) return;
  if (!/^image\//.test(file.type)) return toast('이미지 파일만 올릴 수 있어요', true);
  if (file.size > MAX_FILE) return toast('20MB 이하 파일만 올릴 수 있어요', true);
  const path = `${s.project_id}/${sid}/photo-${Date.now()}.${extOf(file.name) || 'jpg'}`;
  toast('사진 올리는 중…');
  try {
    await api.uploadFile(path, file, file.type);
    const old = s.photo_path;
    await updateSpeaker(sid, { photo_path: path });
    toast('사진을 올렸어요');
  } catch (e) { err(e); }
}
async function spPhotoDel() {
  const s = spOf(S.spId); if (!s?.photo_path || !confirm('사진을 삭제할까요?')) return;
  const old = s.photo_path;

}
async function uploadFlightFiles(sid, files) {
  const s = spOf(sid); if (!s || !files.length) return;
  const okType = f => /^(application\/pdf|image\/png|image\/jpeg)$/.test(f.type) || /\.(pdf|png|jpe?g)$/i.test(f.name);
  const ok = files.filter(okType);
  if (ok.length < files.length) toast('PDF, PNG, JPG 파일만 올릴 수 있어요', true);
  const added = [];
  for (const [i, f] of ok.entries()) {
    if (f.size > MAX_FILE) { toast(`${f.name}: 20MB를 넘어서 올리지 못했어요`, true); continue; }
    const ext = extOf(f.name);
    const type = f.type || (ext === 'pdf' ? 'application/pdf' : ext === 'png' ? 'image/png' : 'image/jpeg');
    const path = `${s.project_id}/${sid}/flight/${Date.now()}-${i}.${ext || 'bin'}`;
    toast(`올리는 중… (${i + 1}/${ok.length})`);
    try { await api.uploadFile(path, f, type); added.push({ path, name: f.name, type, size: f.size }); } catch (e) { err(e); }
  }
  if (!added.length) return;
  const cur = spOf(sid); if (!cur) return;
  await updateSpeaker(sid, { flight_files: [...(cur.flight_files || []), ...added] });
  toast(`파일 ${added.length}개를 첨부했어요`);
}
async function spFileDel(path) {
  const s = spOf(S.spId); if (!s) return;

async function spFileOpen(path, bucket) {
  const w = window.open('', '_blank');
  try { const url = await fileUrl(path, bucket); if (w) w.location.href = url; else location.href = url; }
  catch (e) { if (w) w.close(); err(e); }
}

async function copyText(t) {

let metaTimer = null;
function onRealtime(kind, p) {
  if (kind === 'vruns') {
    if (!isVehicleProject(curProject())) return;
    if (p.eventType === 'DELETE') { const id = p.old?.id; if (!id || !vrOf(id)) return; S.vruns = S.vruns.filter(r => r.id !== id); }
    else { const row = p.new; if (!row || row.project_id !== S.pid) return; const cur = vrOf(row.id); if (cur) Object.assign(cur, row); else S.vruns.push(row); }
    clearTimeout(onRealtime.vt); onRealtime.vt = setTimeout(() => renderVrBody(), 120);
    return;
  }
  if (kind === 'vopts') {
    if (!isVehicleProject(curProject())) return;
    clearTimeout(onRealtime.vo);
    onRealtime.vo = setTimeout(() => api.opts('vehicle_status_opts', S.pid).then(r => { S.vopts = r.sort((a, b) => a.sort_order - b.sort_order); renderVrBody(); }).catch(() => {}), 250);
    return;
  }
  if (kind === 'tasks') {
    const pr = curProject(); if (!pr || KIND_TABLE[pr.kind]) return;
    if (p.eventType === 'DELETE') {
      const id = p.old?.id; if (!id || !S.tasks.some(t => t.id === id)) return;
      S.tasks = S.tasks.filter(t => t.id !== id);
      if ($('#drawer').classList.contains('open') && $('#drawer').dataset.id === id) { closeDrawer(); toast('보고 있던 작업이 삭제됐어요 (연사 확정 해제 등)', true); }
    } else {
      const row = p.new; if (!row || row.project_id !== S.pid) return;
      const cur = S.tasks.find(t => t.id === row.id); if (cur) Object.assign(cur, row); else S.tasks.push(row);
    }
    clearTimeout(onRealtime.tk);
    const redraw = () => {
      const a = document.activeElement;
      if (a && a.closest && a.closest('#main, #drawer') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a?.isContentEditable) { onRealtime.tk = setTimeout(redraw, 800); return; }
      if (S.tab !== 'docs') renderMain();
      const dr = $('#drawer'); if (dr.classList.contains('open') && S.tasks.some(t => t.id === dr.dataset.id)) openTask(dr.dataset.id);
    };
    onRealtime.tk = setTimeout(redraw, 150);
    return;
  }
  if (kind === 'comments') {
    const r = p.new;
    if (CMT.cur && (p.eventType === 'DELETE' || (r && CMT.cur === r.table_name + ':' + r.row_id))) { clearTimeout(onRealtime.ct); onRealtime.ct = setTimeout(loadCmts, 200); }
    return;
  }
  if (kind === 'speakers') {
    if (p.eventType === 'DELETE') {
      const id = p.old?.id; if (!id || !spOf(id)) return;
      S.speakers = S.speakers.filter(s => s.id !== id);
      if (S.spId === id) { closeSpPage(); toast('보고 있던 연사가 다른 사람에 의해 삭제됐어요', true); }
      renderSpBody(); return;
    }
    const row = p.new; if (!row || row.project_id !== S.pid) return;
    const cur = spOf(row.id); if (cur) { PRIV_KEYS.forEach(k => delete row[k]); Object.assign(cur, row); } else S.speakers.push(row);
    renderSpBody(); if (S.spId === row.id) renderSpPage();
  } else if (kind === 'spriv') {
    if (!isSpeakerProject(curProject()) || !p.new) return;
    spMergePriv([p.new]); renderSpBody(); if (S.spId === p.new.speaker_id) renderSpPage();
  } else if (kind === 'nat') {
    api.nationalities().then(n => { S.nats = n; renderSpBody(); if (S.spId) renderSpPage(); }).catch(() => {});
  } else if (kind === 'secret') {
    if (!isSecretProject(curProject())) return;
    if (p.eventType === 'DELETE') { const id = p.old?.id; if (!id || !scOf(id)) return; S.secret = S.secret.filter(x => x.id !== id); renderScBody(); return; }
    const row = p.new; if (!row || row.project_id !== S.pid) return;
    const cur = scOf(row.id); if (cur) Object.assign(cur, row); else S.secret.push(row);
    renderScBody();
  } else if (kind === 'evinfo') {
    api.eventInfo(S.pid).then(r => { S.evInfo = r; if (S.stab === 'dash') renderSpBody(); }).catch(() => {});
  } else if (kind === 'links') {
    if (S.spId) loadLinks();
  } else if (kind === 'sessions') {
    if (p.eventType === 'DELETE') {
      const id = p.old?.id; if (!id || !seOf(id)) return;
      S.sessions = S.sessions.filter(s => s.id !== id);
      if (S.seId === id) { closeSpPage(); toast('보고 있던 세션이 다른 사람에 의해 삭제됐어요', true); }
      renderSeBody(); return;
    }
    const row = p.new; if (!row || row.project_id !== S.pid) return;
    const cur = seOf(row.id); if (cur) Object.assign(cur, row); else S.sessions.push(row);
    renderSeBody(); if (S.seId === row.id) renderSePage(); if (S.ttFull) renderTTFull();
  } else if (kind === 'people') {
    clearTimeout(onRealtime.pt);
    onRealtime.pt = setTimeout(() => { if (isSessionProject(curProject())) loadSePeople(); else if (S.spId) loadLinks(); }, 300);
  } else if (kind === 'venues' || kind === 'pillars' || kind === 'meettypes') {
    if (!isSessionProject(curProject())) return;
    clearTimeout(onRealtime['ot' + kind]);
    onRealtime['ot' + kind] = setTimeout(() => reloadOpts(kind === 'venues' ? 'venue' : kind === 'pillars' ? 'pillar' : 'meet').then(seRefreshAll).catch(() => {}), 250);
  } else if (kind === 'members') {
    clearTimeout(metaTimer);
    metaTimer = setTimeout(async () => {
      const before = myRole();
      try { await reloadMeta(); } catch (_) { return; }
      if (S.view === 'project' && !isMember(S.pid)) { toast('이 프로젝트에서 제외되었어요', true); return afterMembershipChange(); }
      renderSidebar(); renderPeople();

    }, 400);
  }
}

/* ---------- 시간표 PDF (날짜별 한 장 · A3 가로) ---------- */

<script>(document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ setTimeout(function(){ window.print(); }, 300); });<\/script>

}

/* ---------- 저장 · 겹침 검사 ---------- */
function seConflict(s, patch) {
  const n = { ...s, ...patch };
  if (!n.day || !n.venue_id || !n.start_time) return null;
  if (isTbd(venueOf(n.venue_id))) return null;
  const a = hm2m(n.start_time), b = n.end_time ? hm2m(n.end_time) : a + 10;
  return S.sessions.find(o => o.id !== s.id && o.day === n.day && o.venue_id === n.venue_id && o.start_time && a < seEnd(o) && hm2m(o.start_time) < b) || null;
}
function conflictModal(c) {
  openModal(`<div class="conflict"><div class="cf-ico">!</div><h3>입력할 수 없음!</h3>
    <p class="sub">같은 날짜·장소·시간에 이미 다른 세션이 있어요.</p>
    <div class="cf-box"><b>${c.name ? esc(c.name) : '이름 없음'}</b><span>${c.day}일 · ${esc(venueOf(c.venue_id)?.name || '')} · ${seTimeLabel(c)}</span></div></div>
    <div class="modal-foot"><button class="btn-primary" data-act="closeModal">확인</button></div>`);
}
function seRevert() { renderSeBody(true); if (S.seId) renderSePage(true); }
async function updateSession(id, patch, from, opt = {}) {
  const s = seOf(id); if (!s) return;
  for (const k of ['start_time', 'end_time']) if (k in patch && patch[k]) {
    patch[k] = hm(patch[k]); const m = hm2m(patch[k]);
    if (m < TT_START || m > TT_END) { toast('시간은 오전 8시~오후 6시 사이로 입력해 주세요', true); return seRevert(); }
  }
  const n = { ...s, ...patch };
  if (n.start_time && n.end_time && hm2m(n.end_time) <= hm2m(n.start_time)) { toast('종료 시간은 시작 시간보다 늦어야 해요', true); return seRevert(); }
  if (['day', 'venue_id', 'start_time', 'end_time'].some(k => k in patch)) { const c = seConflict(s, patch); if (c) { conflictModal(c); return seRevert(); } }
  if (!opt.noUndo && !confirmSpkClash(s, patch)) return seRevert();
  const prev = {}; for (const k in patch) prev[k] = s[k];
  if (!opt.noUndo) pushUndo({ type:'update', table:'sessions', id, prev: JSON.parse(JSON.stringify(prev)), label: s.name || '이름 없음' });
  Object.assign(s, patch, { updated_at: new Date().toISOString() });
  if (from !== 'body') renderSeBody(); if (S.seId && from !== 'page') renderSePage(); if (S.ttFull) renderTTFull();
  try { const row = await api.updateSession(id, patch); const cur = seOf(id); if (cur && row?.updated_at) cur.updated_at = row.updated_at; return true; }
  catch (e) { const cur = seOf(id); if (cur) Object.assign(cur, prev); if (!opt.noUndo) { S.undo.pop(); updateUndoBtn(); } seRevert(); err(e); return false; }
}
async function seAdd(el) {
  if (!canEdit()) return;
  const field = el?.dataset?.field, raw = el?.dataset?.val;
  const init = { project_id: S.pid, name: '', position: Date.now() };
  if (field) init[field] = raw || null;
  if (S.setab === 'tt') init.day = ssv().tday;
  try {
    const s = await api.createSession(init);
    if (!seOf(s.id)) S.sessions.push(s);
    S.pinned.add(s.id);
    renderSeBody(true);
    if (S.setab === 'list') { const inp = document.querySelector(`tr[data-eid="${s.id}"] .nm-in`); if (inp) { inp.scrollIntoView({ block:'center' }); inp.focus(); } }
    else openSePage(s.id, true);
  } catch (e) { err(e); }
}
async function seDelete(id = S.seId) {
  const s = seOf(id); if (!s || !canEdit()) return;
  if (!confirm(`'${s.name || '이름 없음'}' 세션을 삭제할까요?\n실수로 지웠다면 바로 '되돌리기'(⌘Z)나 휴지통에서 복구할 수 있어요.`)) return;
  try {
    const people = S.sePeopleAll.filter(x => x.session_id === s.id).map(x => ({ speaker_id: x.speaker_id, role: x.role }));
    await api.deleteSession(s.id);
    pushUndo({ type:'delete', table:'sessions', row: JSON.parse(JSON.stringify(s)), people, label: s.name || '이름 없음' });
    S.sessions = S.sessions.filter(x => x.id !== s.id); S.sePeopleAll = S.sePeopleAll.filter(x => x.session_id !== s.id);
    if (S.seId === s.id) closeSpPage();
    renderSeBody(true); toast('세션을 삭제했어요');
  } catch (e) { err(e); }
}

/* ---------- 토글 선택 ---------- */
function sePick(el) {
  const s = seOf(el.dataset.eid); if (!s || !canEdit()) return;
  const f = el.dataset.field, set = v => updateSession(s.id, { [f]: v });
  if (f === 'assignees') {
    const mem = projectMembers(S.pid);
    pickList(el, { multi:true, value:s.assignees || [], title:'담당자 · 여러 명 선택 가능', searchable: mem.length > 6,
      options: mem.map(p => ({ v:p.id, text:(p.full_name || '') + ' ' + p.email, html:`${avatar(p, 22)}<span>${esc(p.full_name || p.email)}</span>` })), onPick:set });
  } else if (f === 'venue_id' || f === 'pillar_id') {
    const kind = f === 'venue_id' ? 'venue' : 'pillar', o = OPT[kind];
    pickList(el, { value:s[f] ?? null, searchable:true, title:o.label,
      options: [{ v:null, text:'', html:'<span class="tg-empty">선택 안 함</span>' }, ...o.list().map(x => ({ v:x.id, text:x.name, html:colorTag(x) }))],
      onPick:set, onCreate: async name => { const x = await optAdd(kind, name); if (x) { closePop(); set(x.id); } },
      footer: { label:`✎ ${o.label} 토글 편집 (이름·순서·색·삭제)`, onClick: () => optManage(kind) } });
  } else if (f === 'day') {
    pickList(el, { value:s.day ?? null, title:'날짜',
      options: [{ v:null, text:'', html:'<span class="tg-empty">미정</span>' }, ...DAYS.map(d => ({ v:d, text:d + '일', html:`<span class="tg tg-gray">${d}일</span>` }))], onPick:set });
  }
}

/* ---------- 장소 · 필라 토글 관리 ---------- */
async function reloadOpts(kind) { const o = OPT[kind]; o.set(sortOpts(await api.opts(o.table, S.pid))); }
async function optAdd(kind, name) {
  const o = OPT[kind], list = o.list();
  const ex = list.find(x => norm(x.name) === norm(name)); if (ex) return ex;
  try {
    const row = await api.optCreate(o.table, { project_id:S.pid, name, color:OPT_COLORS[list.length % OPT_COLORS.length], sort_order:Math.max(0, ...list.map(x => x.sort_order || 0)) + 1 });
    if (!list.some(x => x.id === row.id)) list.push(row);
    sortOpts(list); seRefreshAll(); toast(`'${name}' ${o.label}를 추가했어요`);
    return row;
  } catch (e) { err(e); return null; }
}
function optManage(kind) {
  const o = OPT[kind], ed = canEdit();
  openModal(`<h3>${o.label} 토글 편집</h3>
    <p class="sub">이름·순서·색을 바꾸거나 삭제하면 ${kind === 'meet' ? '모든 세션의 기타일정과 Pre Agenda' : '세션 마스터 전체(목록·보드·필라·시간표)'}에 바로 반영돼요.${kind === 'venue' ? ' 시간표의 가로 순서도 이 순서를 따라요.' : ''}</p>
    <fieldset class="fs" ${ed ? '' : 'disabled'}><div id="optList" class="opt-list"></div>
    <div class="opt-add"><input type="text" id="optNew" placeholder="새 ${o.label} 이름" maxlength="40"><button class="btn-primary" id="optAddBtn" type="button">추가</button></div></fieldset>
    <div class="modal-foot"><button class="btn" data-act="closeModal">닫기</button></div>`);
  const draw = () => {
    const list = o.list();
    $('#optList').innerHTML = list.map((x, i) => {
      const n = o.count ? o.count(x) : S.sessions.filter(s => s[o.field] === x.id).length;
      return `<div class="opt-row" data-oid="${x.id}">
        <button type="button" class="icon-btn sm" data-om="up" ${i === 0 ? 'disabled' : ''} title="위로">↑</button>
        <button type="button" class="icon-btn sm" data-om="down" ${i === list.length - 1 ? 'disabled' : ''} title="아래로">↓</button>
        <button type="button" class="swatch-dot" data-om="color" style="background:${safeColor(x.color)}" title="눌러서 색 바꾸기"></button>
        <input class="opt-name" value="${esc(x.name)}" maxlength="40">
        <span class="opt-cnt">${n}${o.unit || '개'}</span>
        <button type="button" class="icon-btn sm" data-om="del" title="삭제">${ICON.trash}</button></div>`;
    }).join('') || '<div class="hint" style="padding:8px">아직 없어요</div>';
  };
  draw();
  $('#optList').addEventListener('click', async e => {
    const b = e.target.closest('[data-om]'); if (!b || !canEdit()) return;
    const list = o.list(), id = b.closest('.opt-row').dataset.oid, i = list.findIndex(x => x.id === id), x = list[i]; if (!x) return;
    try {
      if (b.dataset.om === 'up' || b.dataset.om === 'down') {
        const j = b.dataset.om === 'up' ? i - 1 : i + 1; if (j < 0 || j >= list.length) return;
        [list[i], list[j]] = [list[j], list[i]];
        const changed = []; list.forEach((y, k) => { if (y.sort_order !== k + 1) { y.sort_order = k + 1; changed.push(y); } });
        draw(); seRefreshAll();
        await Promise.all(changed.map(y => api.optUpdate(o.table, y.id, { sort_order: y.sort_order })));
      } else if (b.dataset.om === 'color') {
        x.color = OPT_COLORS[(OPT_COLORS.indexOf(x.color) + 1) % OPT_COLORS.length];
        draw(); seRefreshAll(); await api.optUpdate(o.table, x.id, { color: x.color });
      } else if (b.dataset.om === 'del') {
        const n = o.count ? o.count(x) : S.sessions.filter(s => s[o.field] === x.id).length;
        if (!confirm(`'${x.name}' ${o.label}를 삭제할까요?${n ? `\n이 ${o.label}를 쓰는 ${o.count ? '미팅' : '세션'} ${n}${o.unit || '개'}는 '${o.label} 없음'이 돼요.` : ''}`)) return;
        await api.optDelete(o.table, x.id);
        o.set(list.filter(y => y.id !== x.id)); if (o.field) S.sessions.forEach(s => { if (s[o.field] === x.id) s[o.field] = null; });
        draw(); seRefreshAll(); toast(`'${x.name}'를 삭제했어요`);
      }
    } catch (er) { err(er); await reloadOpts(kind).catch(() => {}); draw(); seRefreshAll(); }
  });
  $('#optList').addEventListener('change', async e => {
    const inp = e.target; if (!inp.classList.contains('opt-name')) return;
    const x = o.list().find(y => y.id === inp.closest('.opt-row').dataset.oid); if (!x) return;
    const name = inp.value.trim();
    if (!name) { inp.value = x.name; return toast('이름은 비워 둘 수 없어요', true); }
    if (o.list().some(y => y.id !== x.id && norm(y.name) === norm(name))) { inp.value = x.name; return toast('같은 이름이 이미 있어요', true); }
    const old = x.name; x.name = name; seRefreshAll();
    try { await api.optUpdate(o.table, x.id, { name }); toast('이름을 바꿨어요'); } catch (er) { x.name = old; inp.value = old; seRefreshAll(); err(er); }
  });
  const add = async () => { const n = $('#optNew').value.trim(); if (!n) return; const r = await optAdd(kind, n); if (r) { $('#optNew').value = ''; draw(); } };
  $('#optAddBtn').onclick = add;
  $('#optNew').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } });
}

/* ---------- 필터 / 정렬 / 검색 ---------- */

        <div class="fsec"><div class="pop-h">장소</div><div class="fwrap">${S.venues.map(x => ck('venue', x.id, colorTag(x))).join('')}${ck('venue', 'none', '<span class="muted">장소 없음</span>')}</div></div>
        <div class="fsec"><div class="pop-h">필라</div><div class="fwrap">${S.pillars.map(x => ck('pillar', x.id, colorTag(x))).join('')}${ck('pillar', 'none', '<span class="muted">필라 없음</span>')}</div></div>
        <div class="ffoot"><span class="muted" id="sefcount">${seVisible().length}개 표시</span><button type="button" class="link-btn" data-freset="1">초기화</button></div>`;
    };
    draw();
    pop.addEventListener('change', e => {

function seTimePick(el) {

    const t = spk.length && cards.length < spk.length ? await api.resolveTargets({ speaker: spk.filter(id => !cards.some(c => c.id === id)) }) : [];

async function uploadSessionFiles(sid, files) {
  const s = seOf(sid); if (!s || !files.length) return;
  const added = [];

    if (f.size > MAX_SFILE) { toast(`${f.name}: 50MB를 넘어서 올리지 못했어요`, true); continue; }
    const ext = extOf(f.name) || 'bin';
    const path = `${s.project_id}/${sid}/${Date.now()}-${i}.${ext}`;
    toast(`올리는 중… (${i + 1}/${files.length})`);
    try { await api.uploadFile(path, f, f.type || 'application/octet-stream', 'session-files'); added.push({ path, name: f.name, type: f.type || '', size: f.size }); }
    catch (e) { err(e); }
  }
  if (!added.length) return;
  const cur = seOf(sid); if (!cur) return;
  await updateSession(sid, { files: [...(cur.files || []), ...added] });
  toast(`발표자료 ${added.length}개를 첨부했어요`);
}
async function seFileDel(path) {

  const cur = s.keywords || [], next = [...cur];
  words.forEach(w => { if (!next.some(x => x.toLowerCase() === w.toLowerCase())) next.push(w.slice(0, 40)); });

function VR_COLS_LABEL() { return [['category','구분'],['run_date','날짜'],['run_time','시간'],['send_time','호텔 출발시간(센딩)'],['last_name','영문 성'],['first_name','영문 이름'],['pax','인원'],['origin','출발지'],['dest','도착지'],['flight','항공편명'],['terminal','공항·터미널 구분'],['note','비고'],['car_type','차종'],['car_no','차량 번호'],['driver','기사명'],['driver_phone','기사 연락처'],['status_id','운행여부']]; }

const blank = v => v == null || v === '' || (Array.isArray(v) && !v.length);
const same = (a, b) => (blank(a) && blank(b)) || JSON.stringify(a) === JSON.stringify(b);
function diffKeys(a = {}, b = {}) { return [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k => !SKIP_KEYS.has(k) && !same(a[k], b[k])); }

/* ---------- 되돌리기 (⌘Z) ---------- */
function pushUndo(e) {
  if (!S.pid) return;
  S.undo.push({ ...e, pid: S.pid, at: Date.now() });
  if (S.undo.length > 60) S.undo.shift();
  updateUndoBtn();
}
const myUndo = () => S.undo.filter(u => u.pid === S.pid);
function undoDesc(u) {
  if (u.type === 'delete') return `'${u.label}' 삭제`;
  const ks = Object.keys(u.prev); return `'${u.label}' ${ks.slice(0, 2).map(k => fieldName(u.table, k)).join(', ')}${ks.length > 2 ? ' 외' : ''} 수정`;
}
function updateUndoBtn() {
  const b = $('#undoBtn'); if (!b) return;
  const L = myUndo(); b.classList.toggle('hidden', !L.length || !canEdit());
  b.title = L.length ? `되돌리기 (⌘Z) · ${undoDesc(L.at(-1))}` : '';
}
async function undo() {
  if (!canEdit()) return;
  let i = -1; for (let j = S.undo.length - 1; j >= 0; j--) if (S.undo[j].pid === S.pid) { i = j; break; }
  if (i < 0) return toast('되돌릴 작업이 없어요');
  const u = S.undo.splice(i, 1)[0]; updateUndoBtn();
  if (u.type === 'update') {
    if (!rowOf(u.table, u.id)) return toast('그 항목이 이미 삭제돼서 되돌릴 수 없어요', true);
    const ok = await updaterOf(u.table)(u.id, u.prev, null, { noUndo:true });
    if (ok) toast('되돌렸어요 · ' + undoDesc(u));
  } else {
    try { await restoreDeleted(u.table, u.row, u.people); toast('되돌렸어요 · ' + undoDesc(u) + ' 취소'); }
    catch (e) { /duplicate|already exists|23505/i.test(e.message || '') ? toast('이미 복구된 항목이에요', true) : err(e); }
  }
}
async function restoreDeleted(table, row, people) {
  const r = await api.restoreRow(table, row);
  if (r && r.project_id === S.pid) {
    const L = table === 'speakers' ? S.speakers : table === 'sessions' ? S.sessions : table === 'vehicle_runs' ? S.vruns : S.secret;
    if (!L.some(x => x.id === r.id)) L.push(r);
  }
  if (table === 'sessions' && people?.length) {
    for (const p of people) { try { const x = await api.addSessionPerson(r.id, p.speaker_id, p.role); if (x) S.sePeopleAll.push(x); } catch (_) {} }
    if (isSessionProject(curProject())) loadSePeople();
  }
  rerenderProject();
  return r;
}
function rerenderProject() {
  const p = curProject(); if (!p) return;
  if (isSpeakerProject(p)) { renderSpBody(true); if (S.spId) renderSpPage(); }
  else if (isSessionProject(p)) { renderSeBody(true); if (S.seId) renderSePage(); if (S.ttFull) renderTTFull(); }
  else if (isSecretProject(p)) renderScBody(true);
  else if (isVehicleProject(p)) renderVrBody(true);
}

        ${ed ? `<button class="btn sm" data-hi="${i}" title="이 수정이 있기 전 값으로 돌려놓아요">${ICON.undo}이전 값으로</button>` : ''}</div>
      <div class="h-rows">${x.ks.map(k => `<div class="h-row"><span class="h-f">${esc(fieldName(table, k))}</span>
        <span class="h-old">${esc(fmtVal(table, k, x.l.old_row[k]))}</span><span class="h-arr">→</span><span class="h-new">${esc(fmtVal(table, k, x.after?.[k]))}</span></div>`).join('')}</div>
    </div>`).join('')
    : '<div class="hint" style="margin:0;padding:12px 0">아직 수정 기록이 없어요. (schema_v7 실행 이후의 수정부터 기록돼요)</div>';

    const patch = Object.fromEntries(x.ks.map(k => [k, x.l.old_row[k] ?? null]));

    <div class="modal-foot"><button class="btn" data-act="closeModal">닫기</button></div>`);
  $('#modalRoot .modal').classList.add('wide');

  try { logs = await api.deletedLog(p.id, table); }
  catch (e) { const b = $('#trList'); if (b) b.innerHTML = `<div class="alert">${isV7Missing(e) ? V7_HINT : esc(e.message)}</div>`; return; }

        <div class="muted tr-m">${esc(pname(l.changed_by) || '알 수 없음')} 님이 삭제 · ${fmtDT(l.changed_at)}</div></div>
      ${ed ? `<button class="btn" data-ti="${i}">복구</button>` : ''}</div>`).join('')

  });
}

const ATT_DEFAULT = ['계약서', '여권사본', '항공권'];   // 기본 칸 (이름은 바꿀 수 있어요)

    label: a[i]?.label || ATT_DEFAULT[i] || '', files: Array.isArray(a[i]?.files) ? a[i].files.slice() : [] }));
  // 예전 '항공 > 첨부파일'에 올렸던 파일은 항공권 칸으로 옮겨서 보여 줌
  (Array.isArray(s?.flight_files) ? s.flight_files : []).forEach(f => { if (!out[2].files.some(x => x.path === f.path)) out[2].files.push(f); });
  return out;
}
// 파일 이름은 칸 이름으로 표시: 여권사본.pdf, 여권사본_2.jpg …
function attName(a, k, x) {
  const ext = extOf(x.name || x.path), base = (a.label || '첨부파일').replace(/[\\/:*?"<>|]/g, '').trim() || '첨부파일';
  return `${base}${a.files.length > 1 ? '_' + (k + 1) : ''}${ext ? '.' + ext : ''}`;
}

function spAttDel(el) {

  const i = Number(el.dataset.slot), att = attOf(s), k = att[i].files.findIndex(x => x.path === el.dataset.path);

/* =====================================================================
   v10 · 연사 일정 겹침 경고 (같은 날 시간이 겹치는 두 세션에 같은 연사)
   ===================================================================== */
function spkClash(sess, speakerId) {
  if (!sess?.day || !sess.start_time) return [];
  const a = hm2m(sess.start_time), b = seEnd(sess);
  const ids = new Set(S.sePeopleAll.filter(x => x.speaker_id === speakerId && x.session_id !== sess.id).map(x => x.session_id));
  return [...ids].map(seOf).filter(o => o && o.day === sess.day && o.start_time && a < seEnd(o) && hm2m(o.start_time) < b);
}
const clashLine = o => `'${o.name || '이름 없는 세션'}' (${o.day}일 ${seTimeLabel(o)}${venueOf(o.venue_id) ? ' · ' + venueOf(o.venue_id).name : ''})`;
const spkName = id => S.spkNames[id]?.name || '이 연사';
// 세션 시간·날짜를 바꿀 때: 들어 있는 연사 중 다른 세션과 겹치는 사람이 있으면 확인
function confirmSpkClash(s, patch) {
  if (!['day', 'start_time', 'end_time'].some(k => k in patch)) return true;
  const n = { ...s, ...patch };
  const lines = [...new Set(S.sePeopleAll.filter(x => x.session_id === s.id).map(x => x.speaker_id))]
    .flatMap(id => spkClash(n, id).map(o => `· ${spkName(id)} → ${clashLine(o)}`));
  if (!lines.length) return true;
  return confirm(`⚠ 연사 일정이 겹쳐요\n\n${lines.join('\n')}\n\n그래도 이 시간으로 바꿀까요?`);
}
// 스피커 카드 / 연사 페이지 참여 세션에서 겹침 표시
function clashBadge(sess, speakerId) {
  const c = spkClash(sess, speakerId); if (!c.length) return '';
  return `<span class="clash" title="같은 시간에 다른 세션에도 들어가 있어요: ${esc(c.map(clashLine).join(', '))}">⚠ 시간 겹침</span>`;
}

const vehicleProjects = () => S.projects.filter(p => p.vehicle_tab && isMember(p.id) && sameEdition(p));
const T2_AIRLINES = /^(KE|DL|AF|KL)\d/;
function flightGuess(text) {
  const t = String(text || '').toUpperCase();
  const flights = [...t.matchAll(/\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?(\d{2,4})\b/g)].map(m => m[1] + m[2]).filter(f => !/^(T1|T2)\d*$/.test(f));
  const dates = [...String(text || '').matchAll(/(\d{1,2})\s*(?:월|\/|\.)\s*(\d{1,2})\s*일?/g)].map(m => [Number(m[1]), Number(m[2])]).filter(([m, d]) => m >= 1 && m <= 12 && d >= 1 && d <= 31);
  const times = [...String(text || '').matchAll(/\b(\d{1,2}):(\d{2})\b/g)].map(m => `${Number(m[1])}:${m[2]}`);
  const airport = /GMP|김포/.test(t) ? 'GMP' : 'ICN';
  return { flights, dates, times, airport };
}
function nameGuess(s) {
  const pn = String(s.passport_name || '').trim().toUpperCase().split(/[\s,]+/).filter(Boolean);
  if (pn.length >= 2) return { last: pn[0], first: pn.slice(1).join(' ') };
  const nm = String(s.name || '').trim().split(/\s+/).filter(Boolean);
  if (nm.length >= 2 && /^[A-Za-z]/.test(nm[0])) return { last: nm.at(-1).toUpperCase(), first: nm.slice(0, -1).join(' ').toUpperCase() };
  return { last: (pn[0] || nm[0] || '').toUpperCase(), first: '' };
}
