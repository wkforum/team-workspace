<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 워크스페이스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --side:#fbfbfa; --line:#e7e7e3; --line2:#d6d6d1;
  --text:#1f2328; --muted:#6b7280; --hover:#efefeb;
  --accent:#4f46e5; --accent-weak:#eef2ff; --accent-line:#c7d2fe;
  --danger:#dc2626; --ok:#16a34a; --col:#f0f0ec;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- 버튼 ---------- */
.btn,.btn-primary,.btn-danger{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn{border:1px solid var(--line2);background:#fff}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:#fef2f2}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* ---------- 로그인 ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.login-card h1{font-size:20px;margin:16px 0 6px}
.login-card p{color:var(--muted);margin:0 0 22px;line-height:1.5}
.login-card form{display:flex;flex-direction:column;gap:10px}
.login-card input{padding:11px 12px;border:1px solid var(--line2);border-radius:9px}
.login-card .btn-primary{justify-content:center;padding:11px}
#loginMsg{margin-top:14px;font-size:13px;line-height:1.5}
.forgot{margin-top:14px;font-size:12.5px;color:var(--muted);text-decoration:underline}
.forgot:hover{color:var(--text)}
.link-btn{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:10px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.logo.big{width:46px;height:46px;border-radius:12px;font-size:20px}

/* ---------- 레이아웃 ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;height:100vh}
#sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:700;font-size:15px}
nav{flex:1;overflow:auto;padding:4px 8px 12px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:7px;text-align:left;color:#37352f;margin-bottom:1px}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-ico{width:16px;height:16px;flex:none;opacity:.75}
.soon{font-size:11px;color:var(--muted);background:var(--hover);padding:1px 7px;border-radius:99px;font-weight:500}
.nav-label{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 6px;font-size:12px;color:var(--muted);font-weight:600}
.nav-label .icon-btn{width:22px;height:22px;font-size:17px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.empty-sm{color:var(--muted);font-size:12px;padding:6px 10px;line-height:1.5}
.me{border-top:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:10px}
.me .info{flex:1;min-width:0;cursor:pointer}
.me .n{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .e{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:20px 28px 0;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ph-top{display:flex;align-items:center;gap:12px;min-height:34px}
.ph h1{font-size:20px;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.ph h1 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph h1 .dot{width:12px;height:12px;border-radius:4px}
.av-stack{display:flex;align-items:center;padding-left:6px}
.av-stack .av{margin-left:-6px;border:2px solid #fff}
.av-more{font-size:12px;color:var(--muted);margin-left:6px}
.tabs{display:flex;gap:2px;margin-top:12px}
.tab{padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-color:var(--text);font-weight:600}
.content{flex:1;overflow:auto;padding:20px 28px 40px}
.loading{padding:40px;color:var(--muted)}
.people-toggle{display:inline-flex}
.people-toggle svg{flex:none}
#app.people-closed{grid-template-columns:240px minmax(0,1fr) 0}
#app.people-closed #people{display:none}

.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;line-height:1}

/* ---------- 보드 ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;align-items:start;min-width:780px}
.col{background:var(--col);border-radius:12px;padding:10px;border:2px solid transparent;transition:border-color .1s}
.col.over{border-color:var(--accent-line);background:#eceefb}
.col header{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 6px 10px}
.st{width:8px;height:8px;border-radius:50%;flex:none}
.st-todo{background:#94a3b8}.st-doing{background:#f59e0b}.st-done{background:#22c55e}
.cnt{color:var(--muted);font-weight:500;font-size:12px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:var(--line2)}
.card.dragging{opacity:.4}
.card-title{line-height:1.45;word-break:break-word}
.card.is-done .card-title{color:var(--muted);text-decoration:line-through}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;min-height:22px}
.due{font-size:12px;color:var(--muted)}
.due.over{color:var(--danger);font-weight:600}
.pri{display:inline-block;color:#fff;background:var(--danger);border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;margin-right:6px;vertical-align:1px}
.quick-add input{width:100%;margin-top:8px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent}
.quick-add input::placeholder{color:var(--muted)}
.quick-add input:hover{background:rgba(255,255,255,.6)}
.quick-add input:focus{background:#fff;border-color:var(--line2);outline:none}

/* ---------- 리스트 ---------- */
.list-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list-wrap .quick-add{padding:6px 10px;border-bottom:1px solid var(--line)}
.list-wrap .quick-add input{margin:0}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafaf9}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafaf8}
tbody tr:last-child td{border-bottom:0}
.check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:11px}
.check.on{background:var(--ok);border-color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--hover);white-space:nowrap}
.who{display:flex;align-items:center;gap:7px;white-space:nowrap}
.muted{color:var(--muted)}

/* ---------- 문서 ---------- */
.docs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.doc-list{display:flex;flex-direction:column;gap:2px}
.doc-list .btn{margin-bottom:8px;justify-content:center}
.doc-item{text-align:left;padding:7px 10px;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item:hover{background:var(--hover)}
.doc-item.active{background:#fff;border:1px solid var(--line);font-weight:600}
.doc-editor{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 32px 16px;min-height:60vh;display:flex;flex-direction:column}
.doc-toolbar{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.doc-toolbar button{padding:5px 9px;border-radius:6px;font-size:13px;color:#444}
.doc-toolbar button:hover{background:var(--hover)}
.doc-title{border:0;outline:0;font-size:28px;font-weight:700;padding:6px 0;width:100%}
.doc-body{flex:1;outline:0;line-height:1.7;font-size:15px;padding:6px 0 30px;min-height:300px}
.doc-body:empty::before{content:attr(data-placeholder);color:#aaa}
.doc-body h1{font-size:24px;margin:18px 0 6px}.doc-body h2{font-size:19px;margin:16px 0 4px}.doc-body h3{font-size:16px;margin:14px 0 4px}
.doc-body p{margin:4px 0}
.doc-body blockquote{border-left:3px solid var(--line2);margin:8px 0;padding:2px 12px;color:#555}
.doc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}

/* ---------- 빈 화면 ---------- */
.placeholder{max-width:420px;margin:60px auto;text-align:center;color:var(--muted);line-height:1.6}
.placeholder .big-ico{width:56px;height:56px;border-radius:16px;background:var(--accent-weak);color:var(--accent);display:inline-grid;place-items:center;font-size:26px;margin-bottom:10px}
.placeholder h2{color:var(--text);font-size:18px;margin:6px 0}
.empty{color:var(--muted);text-align:center;padding:50px 20px}

/* ---------- 오른쪽: 팀원 ---------- */
#people{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.people-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;gap:8px}
.people-head h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.search{margin:0 16px 8px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search:focus{outline:none;border-color:var(--line2);background:#fff}
#peopleList{flex:1;overflow:auto;padding:4px 8px 16px}
.person{display:flex;gap:10px;padding:10px 8px;border-radius:9px;align-items:flex-start}
.person:hover{background:#fafaf8}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pemail{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;background:#fef3c7;color:#92400e}
.badge.me{background:var(--accent-weak);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 4px 2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 10%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);border:1px solid color-mix(in srgb,var(--c) 25%,#fff)}
.chip.ro{padding-right:8px}
.chip-x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:13px;line-height:1;opacity:.55}
.chip-x:hover{opacity:1;background:rgba(0,0,0,.08)}
.nochip{font-size:11.5px;color:var(--muted)}

/* ---------- 드로어(작업 상세) ---------- */
#drawer{position:fixed;inset:0;pointer-events:none;z-index:40}
#drawer.open{pointer-events:auto}
.drawer-backdrop{position:absolute;inset:0;background:rgba(15,15,15,.12)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.06);padding:16px 24px 24px;overflow:auto;display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.drawer-head .sp{flex:1}
.done-btn{border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.done-btn.on{background:#ecfdf5;border-color:#a7f3d0;color:var(--ok)}
.t-title{width:100%;border:0;outline:0;font-size:22px;font-weight:700;resize:none;padding:4px 0;line-height:1.35;overflow:hidden}
.fields{display:grid;grid-template-columns:90px 1fr;gap:10px 12px;align-items:center;margin:14px 0 18px}
.fields label{color:var(--muted);font-size:13px}
.fields select,.fields input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%;max-width:260px}
.lbl{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:14px 0 6px}
.hint{font-weight:400;color:#9ca3af;margin-left:4px}
.t-desc{width:100%;min-height:220px;flex:1;border:1px solid var(--line);border-radius:9px;padding:12px;line-height:1.6;resize:vertical}
.t-desc:focus,.fields select:focus,.fields input:focus{outline:none;border-color:var(--accent-line)}
.t-meta{color:var(--muted);font-size:12px;margin-top:12px}

/* ---------- 모달 ---------- */
#modalRoot{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px}
#modalRoot.open{display:grid}
.modal-bg{position:absolute;inset:0;background:rgba(15,15,15,.35)}
.modal{position:relative;background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--muted);margin:0 0 12px;font-size:13px;line-height:1.5}
.modal textarea,.modal input[type=text],.modal input[type=email]{width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:9px;resize:vertical}
.modal textarea:focus,.modal input:focus{outline:none;border-color:var(--accent)}
.toggles{display:flex;flex-direction:column;gap:6px}
.toggle-row{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;user-select:none}
.toggle-row:hover{background:#fafaf8}
.toggle-row .nm{flex:1}
.toggle-row input{position:absolute;opacity:0;pointer-events:none}
.switch{width:36px;height:20px;border-radius:99px;background:#d4d4d0;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle-row input:checked + .switch{background:var(--accent)}
.toggle-row input:checked + .switch::after{left:18px}
.toggle-row:has(input:checked){border-color:var(--accent-line);background:var(--accent-weak)}
.toggle-row input:focus-visible + .switch{outline:2px solid var(--accent);outline-offset:2px}
.sel-all{font-size:12px;color:var(--accent);font-weight:600}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.alert{background:#fef2f2;color:#991b1b;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:12px;line-height:1.5;word-break:break-all}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid transparent}
.swatch.on{border-color:var(--text);box-shadow:inset 0 0 0 2px #fff}
.person.mini{padding:8px 0 14px}

/* ---------- 토스트 / 데모 표시 ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1f2328;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:#b91c1c}
#demoBanner{position:fixed;left:12px;bottom:66px;z-index:30;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:8px;padding:6px 10px;font-size:11.5px;width:216px;line-height:1.45}

/* ---------- 연사 마스터 ---------- */
.fs{border:0;margin:0;padding:0;min-width:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.tg{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:5px;font-size:12.5px;font-weight:500;white-space:nowrap;line-height:1.6}
.tg-gray{background:#ebebe8;color:#55534e}
.tg-red{background:#fde0dd;color:#b42318}
.tg-blue{background:#dbe7fd;color:#1d4ed8}
.tg-green{background:#d6f3e0;color:#15803d}
.tg-yellow{background:#fbefc2;color:#8a5a00}
.tg-purple{background:#ece4fd;color:#6d28d9}
.tg-empty{color:#b4b4b0;font-size:13px}
.gnum{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:5px;background:#1f2328;color:#fff;font-size:11px;font-weight:700;margin-right:6px;padding:0 5px}
.ro-note{font-size:12px;color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 9px;white-space:nowrap}
.ph-top .btn{padding:6px 12px}
.ph-top .btn svg{flex:none}
.badge-n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;padding:0 5px}

.sp-toolbar{display:flex;align-items:center;gap:8px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;flex-wrap:wrap}
.sp-tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.tool{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.on{color:var(--accent);background:var(--accent-weak)}
.search-box{display:flex;align-items:center;border-radius:8px;border:1px solid transparent;transition:background .15s}
.search-box input{width:0;padding:0;border:0;outline:0;background:transparent;transition:width .18s,padding .18s;font-size:13px}
.search-box.open{background:#fff;border-color:var(--line2)}
.search-box.open input{width:190px;padding:5px 10px 5px 0}
.filter-note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.filter-note a{color:var(--accent);cursor:pointer;font-weight:600}

/* 목록 표 */
.sp-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 230px)}
.sp-table{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px;table-layout:fixed}
.sp-table th{position:sticky;top:0;z-index:3;background:#fafaf9;font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid #f0f0ed;white-space:nowrap}
.sp-table td{padding:0;border-bottom:1px solid #efefec;border-right:1px solid #f3f3f0;height:38px;vertical-align:middle;background:#fff}
.sp-table .c-chk{width:62px}.sp-table .c-name{width:230px}.sp-table .c-asg{width:200px}.sp-table .c-nat{width:110px}.sp-table .c-st{width:126px}
.sp-table .c-pp{width:170px}.sp-table .c-pn{width:130px}.sp-table .c-birth{width:120px}.sp-table .c-pri{width:90px}
.sp-table th.c-chk,.sp-table td:first-child{position:sticky;left:0;z-index:2}
.sp-table th.c-name,.sp-table tr.sp-row td:nth-child(2){position:sticky;left:62px;z-index:2;box-shadow:1px 0 0 var(--line)}
.sp-table th.c-chk,.sp-table th.c-name{z-index:4}
.grp-head td{background:#fbfbfa!important;border-bottom:1px solid var(--line);height:auto;position:static!important}
.grp-h{display:flex;align-items:center;gap:6px;padding:12px 10px 8px;position:sticky;left:0;width:max-content}
.grp-h .cnt{margin-left:4px}
.fold{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--muted);cursor:pointer;font-size:12px}
.fold:hover{background:var(--hover)}
.chk-cell{display:flex;align-items:center;gap:4px;padding:0 8px 0 4px}
.drag-h{cursor:grab;color:#c4c4c0;font-size:12px;letter-spacing:-2px;padding:4px 3px;user-select:none;visibility:hidden}
.sp-row:hover .drag-h{visibility:visible}
fieldset:disabled .drag-h{display:none}
.sp-table .check{width:20px;height:20px}
.cell-in{width:100%;height:37px;border:0;padding:0 10px;background:transparent;outline:none;font:inherit;color:inherit;min-width:0}
.cell-in:focus{box-shadow:inset 0 0 0 2px var(--accent-line);background:#fff}
.cell-in::placeholder{color:#c4c4c0}
.name-cell{display:flex;align-items:center;position:relative}
.nm-in{font-weight:600}
.row-acts{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:4px;opacity:0;transition:opacity .1s}
.sp-row:hover .row-acts,.se-row:hover .row-acts,.row-acts:focus-within{opacity:1}
.open-btn{font-size:11.5px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);white-space:nowrap}
.open-btn:hover{color:var(--text);background:#f7f7f5}
.del-btn{display:grid;place-items:center;width:24px;height:22px;color:var(--muted);background:#fff;border:1px solid var(--line2);border-radius:6px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.del-btn:hover{color:var(--danger);border-color:#fecaca;background:#fef2f2}
fieldset:disabled .del-btn{display:none}
.cell-btn{width:100%;min-height:37px;padding:4px 10px;text-align:left;display:flex;align-items:center;gap:4px;flex-wrap:wrap;cursor:pointer}
.cell-btn:hover:not(:disabled){background:#f6f6f4}
.cell-btn:disabled{cursor:default}
.who-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;margin-right:6px;white-space:nowrap}
.sp-row.is-done .nm-in{color:var(--muted);text-decoration:line-through}
.sp-row.dragging td{opacity:.4}
.sp-row.drop-before td{box-shadow:inset 0 2px 0 var(--accent)}
tbody.grp.over .grp-head td{background:var(--accent-weak)!important}
.add-row td{height:34px;border-bottom:1px solid var(--line);position:static!important}
.add-link{display:inline-block;padding:6px 12px;color:var(--muted);cursor:pointer;font-size:13px;border-radius:6px;position:sticky;left:0}
.add-link:hover{color:var(--text);background:var(--hover)}

/* 보드 */
.sboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;align-items:start;overflow-x:auto;padding-bottom:10px}
.scol{background:var(--col);border-radius:12px;padding:10px;border:2px solid transparent;transition:border-color .1s}
.scol.over{border-color:var(--accent-line);background:#eceefb}
.scol header{display:flex;align-items:center;gap:6px;padding:2px 4px 10px}
.scards{display:flex;flex-direction:column;gap:8px;min-height:24px}
.scard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.scard:hover{border-color:var(--line2)}
.scard.dragging{opacity:.4}
.scard-top{display:flex;gap:8px;align-items:flex-start}
.scard-top .check{width:18px;height:18px;margin-top:1px;flex:none;font-size:10px}
.scard-name{font-weight:600;flex:1;word-break:break-word;line-height:1.4}
.scard.is-done .scard-name{color:var(--muted);text-decoration:line-through}
.scard-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.scard-tags .tg{font-size:11.5px}
.scard-foot{display:flex;justify-content:flex-end;margin-top:8px}
.scard-foot .av{margin-left:-5px;border:2px solid #fff}
.scol-add{width:100%;text-align:left;padding:8px;color:var(--muted);border-radius:7px;margin-top:6px;font-size:13px}
.scol-add:hover{background:rgba(255,255,255,.7);color:var(--text)}

/* 대시보드 */
.dash{display:grid;gap:16px;max-width:1180px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500}
.kpi .v{font-size:34px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.dcard h4{margin:0 0 12px;font-size:14px}
.prog-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13px;color:var(--muted)}
.prog-h b{font-size:20px;color:var(--text)}
.bar{height:8px;background:#f0f0ec;border-radius:99px;overflow:hidden;display:flex}
.bar.big{height:12px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drow{padding:8px 0 10px;border-bottom:1px solid #f3f3f0}
.drow:last-child{border-bottom:0}
.drow-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.dlab{display:flex;align-items:center;min-width:0;overflow:hidden}
.dnum{font-size:12.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dnum b{font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}

/* 팝오버 */
.pop{position:fixed;z-index:90;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;min-width:210px;max-width:320px;max-height:min(440px,70vh);overflow:auto}
.pop-h{font-size:11.5px;color:var(--muted);padding:6px 8px 4px;font-weight:600}
.pop-search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:4px;outline:none}
.pop-search:focus{border-color:var(--accent-line)}
.pop-opt{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;text-align:left;min-height:32px}
.pop-opt:hover{background:var(--hover)}
.pop-opt .ck{margin-left:auto;color:var(--accent);font-weight:700;visibility:hidden}
.pop-opt.sel .ck{visibility:visible}
.pop-create{color:var(--accent)}
.pop-empty{color:var(--muted);padding:8px;font-size:13px}
.fpanel{width:320px;max-width:calc(100vw - 16px);padding:8px}
.fsec{padding:2px 0 8px;border-bottom:1px solid #f0f0ed;margin-bottom:6px}
.fwrap{display:flex;flex-wrap:wrap;gap:2px}
.fopt{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.fopt:hover{background:var(--hover)}
.fopt input{accent-color:var(--accent);margin:0}
.ffoot{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 2px;font-size:12.5px}
.ffoot .link-btn{margin:0}

/* 연사 상세 페이지 */
#spage{position:fixed;inset:0;z-index:45;pointer-events:none}
#spage.open{pointer-events:auto}
.sp-backdrop{position:absolute;inset:0;background:rgba(15,15,15,.14)}
.sp-panel{position:absolute;top:0;right:0;bottom:0;width:min(780px,100%);background:#fff;box-shadow:-12px 0 36px rgba(0,0,0,.1);overflow:auto;padding:0 44px 48px}
.sp-top{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:5;display:flex;align-items:center;gap:8px;padding:14px 0 12px;border-bottom:1px solid #f0f0ed;margin-bottom:8px}
.sp-top .sp{flex:1}
.sp-title{font-size:30px;font-weight:700;border:0;outline:0;width:100%;padding:14px 0 10px;background:transparent;letter-spacing:-.3px}
.sp-title::placeholder{color:#c9c9c5}
.props{display:grid;grid-template-columns:150px minmax(0,1fr);gap:2px 10px;align-items:center}
.props>label{color:var(--muted);font-size:13px;padding:8px 0;display:flex;align-items:center;gap:7px;align-self:start}
.pv{min-height:36px;display:flex;align-items:center;min-width:0}
.pv-btn{min-height:34px;border-radius:6px;padding:4px 8px}
.pin{width:100%;border:0;padding:8px;border-radius:6px;outline:0;background:transparent;font:inherit;color:inherit}
.pin:hover:not(:disabled){background:var(--hover)}
.pin:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent-line)}
.pin::placeholder{color:#c4c4c0}
.pin:disabled{color:#9a9a96}
.sec{font-size:15px;font-weight:700;margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.desc-grid{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 10px}
.dl{font-weight:600;color:#37352f;padding-top:9px;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.dl .copy-btn{font-size:11.5px;padding:2px 7px}
.ta{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;line-height:1.6;font:inherit;color:inherit;min-height:38px;overflow:hidden;background:#fff}
.ta:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-weak)}
.sl{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:12px 0 6px}
.links{flex-direction:column;align-items:stretch;gap:4px;padding:4px 0}
.link-item{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 10px;min-height:34px}
.lk-open{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;padding:4px 0}
.lk-open:hover .lk-title{text-decoration:underline}
.lk-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-proj{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:auto;padding-right:4px}
.lk-lock{flex:1;color:var(--muted);font-size:13px;padding:5px 0}
.icon-btn.sm{width:24px;height:24px;font-size:12px}
.links .add-link{position:static;align-self:flex-start;padding:5px 8px}
.photo-row{display:flex;gap:18px;align-items:flex-start}
.photo-box{width:150px;height:190px;border-radius:12px;background:#f4f4f2;border:1px dashed var(--line2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;flex:none}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.file-btn{cursor:pointer;position:relative}
fieldset:disabled .file-btn{opacity:.45;pointer-events:none}
.files{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.files .file-btn{align-self:flex-start}
.file-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 8px}
.fic{font-size:10px;font-weight:800;border-radius:5px;padding:4px 5px;color:#fff;flex:none}
.fic.pdf{background:#dc2626}.fic.img{background:#2563eb}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:500}
.fname:hover{text-decoration:underline}
.fsize{color:var(--muted);font-size:12px}
fieldset:disabled .file-item .icon-btn{display:none}
.dayboxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.daybox{border:1.5px solid var(--line2);border-radius:12px;padding:18px 10px;text-align:center;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;transition:background .12s}
.daybox:hover:not(:disabled){border-color:#d4d4cf;background:#fafaf8}
.daybox .dck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px;background:#fff}
.daybox.on{background:#fde68a;border-color:#f59e0b;color:#713f12}
.daybox.on:hover:not(:disabled){background:#fcd34d}
.daybox.on .dck{background:#f59e0b;border-color:#f59e0b;color:#fff}
.events{display:flex;flex-direction:column;gap:8px}
.ev-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 16px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on-yes{background:#dcfce7;color:#15803d;font-weight:700}
.seg button.on-no{background:#efefec;color:#3f3f3c;font-weight:700}
.diet{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.diet-chk{display:flex;align-items:center;gap:8px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.diet-chk input{width:16px;height:16px;accent-color:#dc2626;margin:0}
.diet-chk:has(input:checked){background:#fef2f2;border-color:#fecaca;color:#b42318}
.diet-in{flex:1;min-width:220px;border:1px solid var(--line)}
.sp-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* 공유 · 연결 모달 */
.share-invite{display:flex;gap:6px;margin-bottom:14px}
.share-invite input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line2);border-radius:9px}
.share-invite select,.role-sel{padding:8px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.share-list{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.share-row{display:flex;align-items:center;gap:10px;padding:8px}
.share-row .pinfo{flex:1;min-width:0}
.role-tag{font-size:12px;color:var(--muted);background:var(--hover);padding:3px 9px;border-radius:99px}
.share-link{display:flex;gap:6px}
.share-link input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--muted);font-size:12.5px}
.lk-res{max-height:340px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:4px}
.lk-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px;border-radius:7px}
.lk-opt:hover{background:var(--hover)}
.modal:has(.share-list),.modal:has(.lk-res){max-width:540px}

.pw-mail{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px;font-size:13px}
.pw-mail .hint{margin:3px 0 0;line-height:1.5;font-size:12px}

/* 세션 마스터 */
.se-table{min-width:980px}
.se-table th.c-name{left:0}
.se-table .c-name{width:280px}.se-table .c-asg{width:190px}.se-table .c-ven{width:140px}.se-table .c-pil{width:120px}.se-table .c-day{width:90px}.se-table .c-time{width:210px}
.th-hint{font-weight:400;color:#b4b4b0;margin-left:4px}
.time-cell{display:flex;align-items:center;gap:2px;padding-right:6px}
.time-cell span{color:var(--muted)}
.cell-in.tm{padding:0 6px;font-variant-numeric:tabular-nums}
.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px}
.se-ppl{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:12px;color:#55534e;line-height:1.4}
.se-ppl b{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:#ece4fd;color:#6d28d9;font-size:9.5px;margin-right:4px;vertical-align:1px}
.se-ppl span:nth-child(2) b{background:#dbe7fd;color:#1d4ed8}
.tt-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.daytabs{display:inline-flex;background:#ececea;border-radius:10px;padding:3px}
.daytab{padding:6px 16px;border-radius:8px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.daytab.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tt-note{font-size:12.5px}
.tt-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:calc(100vh - 260px)}
.tt{display:grid;min-width:max-content;position:relative}
.tt-corner,.tt-head{position:sticky;top:0;z-index:3;background:#fafaf9;border-bottom:1px solid var(--line);height:42px}
.tt-corner{left:0;z-index:4}
.tt-head{display:flex;align-items:center;justify-content:center;border-left:1px solid #ececea;padding:0 6px}
.tt-times{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--line)}
.tt-hour{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;background:#fff;padding:0 2px}
.tt-hour:first-child{transform:none;top:2px!important}
.tt-col{position:relative;border-left:1px solid #ececea;
  background-image:linear-gradient(to bottom,#e4e4e0 1px,transparent 1px),linear-gradient(to bottom,#f3f3f0 1px,transparent 1px);
  background-size:100% calc(var(--row,20px) * 6),100% var(--row,20px)}
.tt-block{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 7px;cursor:pointer;overflow:hidden;
  background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);border-left:3px solid var(--c);
  color:color-mix(in srgb,var(--c) 70%,#000);font-size:12px;line-height:1.35}
.tt-block:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:1}
.tt-time{font-size:10.5px;font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-name{font-weight:700;color:#1f2328}
.tt-block .se-ppl{margin-top:3px;font-size:11px}
.tt-block.short{display:flex;align-items:center;gap:6px;padding-top:1px;padding-bottom:1px}
.tt-block.short .tt-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-block.short .se-ppl{display:none}
.tt-missing{margin-top:14px;background:#fff;border:1px dashed var(--line2);border-radius:10px;padding:12px 14px;font-size:13px}
.tt-missing b{display:block;margin-bottom:8px;font-weight:600}
.sec-hint{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.ppl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ppl-col{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ppl-h{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;padding:0 2px 2px}
.person-chip{display:flex;align-items:center;gap:6px;background:#fafaf9;border:1px solid #efefec;border-radius:8px;padding:2px 4px 2px 10px;min-height:34px}
.pc-name{flex:1;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 0;min-width:0}
.pc-name:hover{color:var(--accent)}
.pc-go{color:var(--muted);font-size:11px}
.ppl-col .add-link{position:static;align-self:flex-start;padding:4px 6px}
.kv-table{width:100%;border-collapse:collapse;margin-top:22px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv-table th{width:150px;text-align:left;background:#fafaf9;font-size:13px;color:#37352f;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.kv-table td{padding:2px 6px;border-bottom:1px solid var(--line)}
.kv-table tr:last-child th,.kv-table tr:last-child td{border-bottom:0}
.copy-field{margin-bottom:10px}
.cf-h{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.cf-h .sl{margin:0}
.copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:3px 9px;cursor:pointer;background:#fff}
.copy-btn:hover{color:var(--text);background:#f7f7f5}
.copy-btn.done{color:var(--ok);border-color:#a7f3d0;background:#ecfdf5}
.fic.ppt{background:#ea580c}.fic.doc{background:#1d4ed8}.fic.vid{background:#7c3aed}.fic.xls{background:#15803d}.fic.etc{background:#64748b}
.time-range{display:flex;align-items:center;gap:6px}
.time-range .pin{width:auto;border:1px solid var(--line)}
.pop-foot{display:block;width:100%;text-align:left;border-top:1px solid var(--line);margin-top:4px;padding:8px;color:var(--accent);font-size:12.5px;font-weight:600;border-radius:0 0 6px 6px}
.pop-foot:hover{background:var(--accent-weak)}
.opt-list{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.opt-row{display:flex;align-items:center;gap:4px}
.opt-row .icon-btn:disabled{opacity:.3;cursor:default}
.swatch-dot{width:20px;height:20px;border-radius:6px;flex:none;margin:0 4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.opt-name{flex:1;min-width:0;padding:7px 9px;border:1px solid transparent;border-radius:7px;font-weight:600}
.opt-name:hover{border-color:var(--line)}
.opt-name:focus{outline:none;border-color:var(--accent)}
.opt-cnt{font-size:12px;color:var(--muted);white-space:nowrap;padding:0 4px}
.opt-add{display:flex;gap:6px;margin-top:10px}
.opt-add input{flex:1;padding:9px 11px;border:1px solid var(--line2);border-radius:9px}
.pk-opt:disabled{opacity:.6;cursor:default}
.pk-state{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.pk-opt:disabled .pk-state{color:var(--ok)}
.conflict{text-align:center;padding-top:6px}
.cf-ico{width:48px;height:48px;border-radius:50%;background:#fee2e2;color:#dc2626;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 10px}
.conflict h3{font-size:20px;color:#b91c1c}
.cf-box{display:flex;flex-direction:column;gap:3px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-top:12px;font-size:13px}
.cf-box span{color:#7f1d1d}

/* 오전/오후 시간 선택 */
.tm-btn{font-variant-numeric:tabular-nums;white-space:nowrap;flex-wrap:nowrap;padding:4px 6px;width:auto;min-width:78px}
.tm-btn.big{border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:96px}
.time-cell .tm-btn{flex:1}
.tpick{padding:8px}
.tp-grid{display:grid;grid-template-columns:72px repeat(6,38px);gap:3px;align-items:center}
.tp-h{font-size:12px;font-weight:600;color:#37352f;padding-right:4px;white-space:nowrap}
.tp-m{height:30px;border-radius:6px;font-size:12.5px;font-variant-numeric:tabular-nums;color:#37352f;background:#f6f6f4}
.tp-m:hover:not(:disabled){background:var(--accent-weak);color:var(--accent)}
.tp-m.sel{background:var(--accent);color:#fff;font-weight:700}
.tp-m:disabled{opacity:.3;cursor:not-allowed}
.pop.tpick{max-width:none}

/* 대시보드 클릭 · 명단 */
.click{cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi.click{display:block;width:100%;transition:border-color .1s,box-shadow .1s}
.kpi.click:hover,.stat.click:hover{border-color:var(--accent-line)}
.kpi.open,.stat.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.kpi-hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.click{background:#fff}
.drow.click{border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}
.drow.click:hover{background:#fafaf8}
.drow.open{background:var(--accent-weak)}
.chev{color:var(--muted);font-size:11px;margin-left:8px}
.peek{border:1px solid var(--accent-line);background:#fbfbff;border-radius:10px;padding:10px 12px;margin:8px 0 10px}
.peek-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.peek-h .sp{flex:1}
.btn.sm{padding:4px 10px;font-size:12px}
.peek-list{display:flex;flex-wrap:wrap;gap:6px}
.peek-item{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:13px;font-weight:500;cursor:pointer}
.peek-item:hover{border-color:var(--accent-line);background:var(--accent-weak)}
.peek-more{align-self:center;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 6px}
.lp-title{font-size:17px;font-weight:700}
.lp-title .muted{font-size:14px;font-weight:500;margin-left:4px}
.lp-search{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;margin:6px 0 12px;outline:none}
.lp-search:focus{border-color:var(--accent)}
.lp-table{width:100%;border-collapse:collapse}
.lp-table th{font-size:12px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:61px;background:#fff}
.lp-table td{padding:8px;border-bottom:1px solid #f0f0ed;vertical-align:middle}
.lp-table tbody tr{cursor:pointer}
.lp-table tbody tr:hover td{background:#fafaf8}
.lp-name{font-weight:600}
.lp-done{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;margin-right:6px}
.lp-table .av{margin-right:-4px;border:2px solid #fff}

.pw-btns{display:flex;gap:6px;flex:none}
.pw-opt{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;font-size:13px}
.pw-opt .hint{margin:4px 0 0;line-height:1.5;font-size:12px}
.pw-opt-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pw-temp{display:flex;gap:6px;margin-top:10px;align-items:center}
.pw-temp input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.5px}
.ok-box{margin-top:10px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:8px;padding:10px;line-height:1.6;font-size:12.5px}
.ok-box code{background:#fff;border:1px solid #a7f3d0;border-radius:4px;padding:1px 5px;font-size:13px}

/* 참석가능일 */
.av-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;max-width:900px}
.av-card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 10px}
.av-card:hover{border-color:#f5d36b}
.av-card.on{background:#fef9e7;border-color:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
.av-day{grid-column:1/-1;font-weight:700;color:#713f12;font-size:13px}
.av-card b{font-size:30px;font-variant-numeric:tabular-nums}
.av-unit{color:var(--muted);font-size:13px}
.av-hint{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:2px}
.av-wrap{max-width:900px}
.av-table{width:100%;border-collapse:separate;border-spacing:0}
.av-table th{position:sticky;top:0;z-index:2;background:#fafaf9;font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.av-table td{padding:6px 12px;border-bottom:1px solid #efefec;vertical-align:middle}
.av-table .av-c{text-align:center;width:90px}
.av-table .av-g{width:150px}
.av-name{display:flex;align-items:center;gap:8px;font-weight:600}
.av-name a{cursor:pointer}
.av-name a:hover{color:var(--accent);text-decoration:underline}
.av-table tr.is-done .av-name a{color:var(--muted);text-decoration:line-through}
.av-cell{text-align:center}
.av-box{width:44px;height:30px;border-radius:7px;border:1.5px solid var(--line2);background:#fff;font-weight:800;color:#78350f}
.av-box:hover:not(:disabled){border-color:#f59e0b}
.av-box.on{background:#fde68a;border-color:#f59e0b}
.av-box:disabled{cursor:default}
.av-sum{text-align:center;font-variant-numeric:tabular-nums}
.av-table tfoot td{position:sticky;bottom:0;background:#fffbeb;font-size:12.5px;font-weight:600;color:#713f12;border-top:1px solid #fde68a;border-bottom:0;padding:9px 12px}

/* 대시보드 상단 */
.dash-top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
.dash-left{display:grid;gap:16px;min-width:0}
.dc-flush{padding:0}
.dc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dc-h h4{margin:0;font-size:15px}
.dc-h .muted{font-size:12.5px;text-align:right}
.dc-b{padding:14px 18px 16px}
.prog-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#f0f0ec;margin-bottom:12px}
.prog-bar i{display:block;height:100%}
.prog-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 10px}
.prog-ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.prog-ch b{font-variant-numeric:tabular-nums}
.prog-item{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:5px;cursor:pointer;font-size:13px;font-weight:500;background:#fff;min-width:0}
.prog-item>span:last-child{word-break:keep-all;overflow-wrap:anywhere;line-height:1.35}
.prog-item:hover{border-color:var(--accent-line);background:var(--accent-weak)}
.prog-item.is-done span:last-child{text-decoration:line-through;color:var(--muted)}
.prog-empty{color:var(--muted);font-size:12.5px}
.pri-badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:800;flex:none;padding:0}
.pri-none{background:#f0f0ec;color:#b4b4b0}
.ev-block{padding:2px 0 14px;border-bottom:1px dashed var(--line2);margin-bottom:12px}
.ev-block:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.ev-h{display:flex;align-items:baseline;justify-content:space-between}
.ev-h b{font-size:14px}
.ev-n{font-size:24px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.ev-n small{font-size:13px;font-weight:600;margin-left:1px}
.ev-n:hover{color:var(--accent)}
.ev-names{font-size:12.5px;color:#55534e;margin:4px 0 8px;line-height:1.6}
.ev-names a{cursor:pointer}
.ev-names a:hover{color:var(--accent);text-decoration:underline}
.ev-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px}
.ev-fields input{grid-column:1/-1}
.ev-in{padding:7px 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:13px;min-width:0}
.ev-in:focus{outline:none;border-color:var(--accent)}
.ss-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:9px 6px;border-bottom:1px solid #f0f0ed;cursor:pointer;border-radius:6px}
.ss-row:last-child{border-bottom:0}
.ss-row:hover{background:#fafaf8}
.ss-when{display:flex;flex-direction:column;font-size:12.5px;font-variant-numeric:tabular-nums}
.ss-when span{color:var(--muted);font-size:12px}
.ss-name{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ss-ppl{font-size:12px;color:#55534e;display:flex;flex-direction:column;gap:1px;margin-top:3px}
.ss-ppl b{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:#ece4fd;color:#6d28d9;font-size:9.5px;margin-right:4px}
.ss-ppl span:nth-child(2) b{background:#dbe7fd;color:#1d4ed8}
@media (max-width:1180px){.dash-top{grid-template-columns:1fr}}

/* 행사 참석 · 특이식성 카드 */
.at-group+.at-group{margin-top:14px}
.at-gh{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.2px}
.at-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.at-row-1{grid-template-columns:minmax(0,1fr)}
.at-tile{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 8px;text-align:left;border-radius:11px;padding:11px 13px;border:1.5px solid transparent;cursor:pointer;transition:box-shadow .12s,border-color .12s}
.at-label{font-size:13px;font-weight:700}
.at-num{grid-row:1/3;grid-column:2;display:flex;align-items:baseline;gap:2px}
.at-num b{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.at-num small{font-size:12.5px;font-weight:600}
.at-bar{grid-column:1;height:5px;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden}
.at-bar i{display:block;height:100%;border-radius:99px}
.at-sub{grid-column:1/-1;font-size:11.5px;opacity:.75}
.at-purple{background:#f3effe;color:#5b21b6}.at-purple .at-bar i{background:#8b5cf6}
.at-amber{background:#fef6dc;color:#78350f}.at-amber .at-bar i{background:#f59e0b}
.at-red{background:#fdecea;color:#991b1b}.at-red .at-bar i{background:#ef4444}
.at-tile:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.at-tile.open{border-color:currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.at-row-1 .at-tile{grid-template-columns:auto 1fr auto}
.at-row-1 .at-label{grid-column:1}
.at-row-1 .at-bar{grid-column:2;grid-row:1}
.at-row-1 .at-num{grid-column:3;grid-row:1/3}
.at-row-1 .at-sub{grid-column:1/3}
.at-card .peek{margin-top:14px;margin-bottom:0}

/* 팀원 삭제 · 공유 */
.del-user:hover{color:var(--danger);background:#fef2f2}
.danger-zone{border-color:#fecaca;background:#fffafa}
.btn-danger.solid{background:var(--danger);color:#fff;border-radius:8px}
.btn-danger.solid:hover{filter:brightness(1.08);background:var(--danger)}
.btn-danger.solid:disabled{opacity:.4;cursor:not-allowed}
.del-list{margin:12px 0 4px;padding-left:20px;font-size:13px;line-height:1.7;color:#37352f}
.role-seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.role-seg button{padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted);background:#fff}
.role-seg button+button{border-left:1px solid var(--line2)}
.role-seg button:hover:not(.on){background:#f7f7f5;color:var(--text)}
.role-seg button.on[data-role="editor"]{background:var(--accent-weak);color:var(--accent)}
.role-seg button.on[data-role="viewer"]{background:#fef3c7;color:#92400e}
.role-seg button.on[data-dir]{background:var(--accent-weak);color:var(--accent)}
.role-seg.busy{opacity:.5;pointer-events:none}
.role-tag.viewer{background:#fef3c7;color:#92400e}
.role-tag.editor{background:var(--accent-weak);color:var(--accent)}
.share-count{font-size:12px;color:var(--muted);margin:0 0 6px 2px}
.secret-note{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:9px;padding:9px 12px;font-size:12.5px;margin:4px 0 10px;line-height:1.5}
.ph-top .btn.share-btn{border-color:var(--accent-line);color:var(--accent);background:var(--accent-weak)}
.ph-top .btn.share-btn:hover{filter:brightness(.98)}

/* 대외비 */
.lock-badge{font-size:12px;font-weight:700;color:#991b1b;background:#fee2e2;border-radius:6px;padding:3px 8px;flex:none}
.sc-banner{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.sc-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sc-hint{font-size:12.5px}
.sc-wrap{max-width:1100px}
.sc-table{width:100%;min-width:720px;border-collapse:separate;border-spacing:0;table-layout:fixed}
.sc-table th{position:sticky;top:0;z-index:2;background:#fafaf9;font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid #f0f0ed}
.sc-table td{padding:0;border-bottom:1px solid #efefec;border-right:1px solid #f3f3f0;height:40px;vertical-align:middle;background:#fff}
.sc-table .sc-name{width:190px}.sc-table .sc-asg{width:170px}.sc-table .sc-fee{width:150px}
.sc-table th.sc-name,.sc-table td:first-child{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
.sc-table th.sc-name{z-index:3}
.sc-table tfoot td:first-child{z-index:3}
.sc-table .num{text-align:right}
.sc-row:hover .row-acts{opacity:1}
.fee-cell{display:flex;align-items:center;padding-left:10px}
.fee-cell .usd{color:var(--muted);font-weight:600}
.fee-in{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding-left:4px}
.sc-table tfoot td{position:sticky;bottom:0;background:#f8fafc;border-top:2px solid var(--line2);padding:12px 10px;height:auto}
.sc-meta{color:var(--muted);font-size:12px;margin-left:10px}
.sc-total{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:#0f172a}

/* 팀원 패널: 관리 아이콘 3개가 있어도 칩이 찌그러지지 않게 */
.person>.icon-btn{width:26px;height:26px}
.person>.icon-btn+.icon-btn{margin-left:-4px}
.chip{max-width:100%;white-space:nowrap}
.chip>span,.chip{overflow:hidden;text-overflow:ellipsis}
.chip .chip-x{flex:none}

.ev-people{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.ev-person{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;background:#fff;min-width:0}
.ev-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.ev-pri{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;font-size:9.5px;font-weight:800;line-height:1}
.ev-pri.none{background:transparent;width:16px}
.ev-nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-af{font-size:12px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-person:hover{border-color:var(--accent-line);background:var(--accent-weak)}
.ev-diet{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:5px;padding:1px 6px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.ev-diet-n{font-size:11.5px;font-weight:700;color:#dc2626;margin-left:8px}

.ws-role{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--accent-line);background:#fbfbff;border-radius:10px;padding:12px;margin:12px 0 4px;font-size:13px}
.ws-role .hint{margin:3px 0 0;font-size:12px}
.role-seg.big button{padding:7px 12px;font-size:13px}
.role-seg.mini button{padding:4px 9px;font-size:12px}
.acc-row{display:flex;align-items:center;gap:8px}
.acc-row .toggle-row{flex:1;min-width:0}
.acc-row.off .role-seg{opacity:.35}
#invRole{display:flex}#invRole button{flex:1}
.badge.vw{background:#fef3c7;color:#92400e}
.badge.ed{background:var(--accent-weak);color:var(--accent)}
.chip.viewer{border-style:dashed}

.ph-top .btn.agenda-btn{border-color:#c7d2fe;color:#1f2328;font-weight:700}
.ph-top .btn.agenda-btn svg,.sp-top .btn.agenda-btn svg{color:#dc2626}
.sp-top .btn.agenda-btn{border-color:#c7d2fe;font-weight:700}

/* 분야·키워드 · 카테고리 · 미팅 */
.opt-chips{display:flex;flex-wrap:wrap;gap:6px}
.ochip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:500;color:#37352f}
.ochip:hover:not(:disabled){border-color:#a5b4fc}
.ochip.on{border-color:#6366f1;background:var(--accent-weak);color:#3730a3;font-weight:700}

<script>
/* =====================================================================
   설정 — Supabase 대시보드 > Project Settings > API (또는 API Keys) 에서 복사
   · SUPABASE_URL: Project URL (예: https://abcdefgh.supabase.co)
   · SUPABASE_ANON_KEY: anon(public) 키 또는 publishable 키
   ※ service_role / secret 키는 절대 여기에 넣지 마세요.
   두 값이 비어 있으면 '데모 모드'로 화면만 미리 볼 수 있습니다.
   ===================================================================== */
const SUPABASE_URL = 'https://fjegxxobljzmgzmrovnd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FwbV0dn-I4EO-AkR0kwDgA_gCJkqrsW';

const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;
const BASE = location.protocol === 'file:' ? location.href.split(/[?#]/)[0] : location.origin + location.pathname;
const REDIRECT = BASE;
// 초대·비밀번호 메일의 링크는 '웹 주소'로 돌아와야 해서, 컴퓨터 파일로 열었을 땐 보내지 않음
const onWeb = () => DEMO || /^https?:$/.test(location.protocol);
const FILE_WARN = '컴퓨터에 저장된 파일로 열려 있어서 메일 링크가 작동하지 않아요. Netlify 주소로 접속해서 보내 주세요.';

// 메일 링크가 실패해서 돌아온 경우(만료·이미 사용됨 등) 이유를 읽어 둠
const LINK_ERROR = (() => {
  const h = new URLSearchParams(location.hash.replace(/^#/, '')), q = new URLSearchParams(location.search);
  const code = h.get('error_code') || q.get('error_code'), desc = h.get('error_description') || q.get('error_description');
  if (!code && !desc && !h.get('error') && !q.get('error')) return null;
  return /expired|invalid|otp/i.test((code || '') + ' ' + (desc || ''))
    ? '메일 링크가 만료됐거나 이미 사용됐어요. 관리자에게 "비밀번호 설정 메일"을 다시 보내 달라고 요청하세요.'
    : '메일 링크로 로그인하지 못했어요: ' + (desc || code).replace(/\+/g, ' ');
})();
if (LINK_ERROR) history.replaceState(null, '', location.pathname);

/* ---------- 공통 유틸 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2));
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const STATUS = [{k:'todo',label:'할 일'},{k:'doing',label:'진행 중'},{k:'done',label:'완료'}];
const STATUS_LABEL = Object.fromEntries(STATUS.map(s => [s.k, s.label]));
const PRIORITY = {high:'높음', normal:'보통', low:'낮음'};
const COLORS = ['#4f46e5','#0891b2','#dc2626','#d97706','#16a34a','#9333ea','#db2777','#475569'];
const AVC = ['#6366f1','#0ea5e9','#14b8a6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#64748b','#22c55e'];
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = s => { if (!s) return ''; const [y,m,d] = s.split('-').map(Number); return `${m}월 ${d}일`; };
const fmtDT = s => s ? new Date(s).toLocaleString('ko-KR', {month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '';

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2800);
}
function err(e) {
  console.error(e);
  const m = e?.message || '';
  toast(/row-level security|permission denied|violates/i.test(m) ? '편집 권한이 없어요 (뷰어는 보기만 가능해요)'
    : /does not exist|schema cache|could not find/i.test(m) ? '데이터베이스 설정이 아직 안 됐어요. setup 폴더의 SQL을 순서대로(최신 schema_v7_collab까지) 실행해 주세요.'
    : (m || '오류가 발생했어요'), true);
}

/* =====================================================================
   데이터 계층 ① Supabase
   ===================================================================== */
function supabaseApi() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
  return {
    async getUser() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    onAuth(cb) { sb.auth.onAuthStateChange((ev, session) => setTimeout(() => cb(ev, session), 0)); },
    async signIn(email, password) {
      const data = await q(sb.auth.signInWithPassword({ email, password }));
      if (data.user?.user_metadata?.password_set !== true) await sb.auth.updateUser({ data: { password_set: true } });
      return data.user;
    },
    sendReset: email => q(sb.auth.resetPasswordForEmail(email, { redirectTo: REDIRECT })),
    setPassword: password => q(sb.auth.updateUser({ password, data: { password_set: true, must_change_password: false } })),
    async adminSetPassword(userId, password) {
      const { data, error } = await sb.functions.invoke('admin-set-password', { body: { userId, password } });
      if (error) {
        let msg = error.message;
        try { const b = await error.context.json(); if (b?.error) msg = b.error; } catch (_) {}
        if (/not found|404|failed to send/i.test(msg)) msg = "서버 함수 'admin-set-password'가 아직 배포되지 않았어요. 배포 후 다시 시도해 주세요.";
        throw new Error(msg);
      }
      if (data?.error) throw new Error(data.error);
      return data;
    },
    signOut: () => sb.auth.signOut(),
    profile: id => q(sb.from('profiles').select('*').eq('id', id).single()),
    profiles: () => q(sb.from('profiles').select('*').order('full_name')),
    updateMyName: (id, full_name) => q(sb.from('profiles').update({ full_name }).eq('id', id)),
    projects: () => q(sb.from('projects').select('*').order('sort_order').order('created_at')),
    createProject: (name, color, sort_order) => q(sb.from('projects').insert({ name, color, sort_order }).select().single()),
    members: () => q(sb.from('project_members').select('*')),
    async setMemberRole(project_id, user_id, role) {
      const rows = await q(sb.from('project_members').update({ role }).eq('project_id', project_id).eq('user_id', user_id).select('user_id,role'));
      if (!rows || !rows.length) throw new Error('권한이 저장되지 않았어요. 관리자 계정인지, setup 폴더의 SQL(v2·v5)을 실행했는지 확인해 주세요.');
      return rows[0];
    },
    async adminDeleteUser(userId) {
      const { data, error } = await sb.functions.invoke('admin-delete-user', { body: { userId } });
      if (error) {
        let msg = error.message;
        try { const b = await error.context.json(); if (b?.error) msg = b.error; } catch (_) {}
        if (/not found|404|failed to send/i.test(msg)) msg = "서버 함수 'admin-delete-user'가 아직 배포되지 않았어요. 배포 후 다시 시도해 주세요.";
        throw new Error(msg);
      }
      if (data?.error) throw new Error(data.error);
      return data;
    },
    // ---- 대외비 ----
    secretItems: pid => q(sb.from('secret_items').select('*').eq('project_id', pid).order('position')),
    createSecret: r => q(sb.from('secret_items').insert(r).select().single()),
    updateSecret: (id, patch) => q(sb.from('secret_items').update(patch).eq('id', id).select('id,updated_at').single()),
    deleteSecret: id => q(sb.from('secret_items').delete().eq('id', id)),
    vruns: pid => q(sb.from('vehicle_runs').select('*').eq('project_id', pid)),
    createEdition: (from_edition, new_edition, copy_members) => q(sb.rpc('create_edition', { from_edition, new_edition, copy_members })),
    setAdmin: (target, make_admin) => q(sb.rpc('set_admin', { target, make_admin })),
    sessionSpeakerCards: session_project => q(sb.rpc('session_speaker_cards', { session_project })),
    vrunsForSpeaker: sid => q(sb.from('vehicle_runs').select('id,project_id,category,run_date,run_time,flight,origin,dest,car_type,driver').eq('speaker_id', sid)),
    speakerPrivate: pid => q(sb.from('speaker_private').select('speaker_id,passport_no,birth_date').eq('project_id', pid)),
    savePrivate: (speaker_id, project_id, patch) => q(sb.from('speaker_private').upsert({ speaker_id, project_id, ...patch, updated_at: new Date().toISOString() }, { onConflict: 'speaker_id' })),
    createVrun: r => q(sb.from('vehicle_runs').insert(r).select().single()),
    createVruns: rows => q(sb.from('vehicle_runs').insert(rows).select()),
    updateVrun: (id, patch) => q(sb.from('vehicle_runs').update(patch).eq('id', id).select('id,updated_at').single()),
    deleteVrun: id => q(sb.from('vehicle_runs').delete().eq('id', id)),

    // v7: 수정 기록 · 휴지통 · 알림 · 댓글 · 내 작업
    changeLog: (table, rowId) => q(sb.from('change_log').select('*').eq('table_name', table).eq('row_id', rowId).order('changed_at', { ascending:false }).limit(60)),
    deletedLog: (pid, table) => q(sb.from('change_log').select('*').eq('project_id', pid).eq('table_name', table).eq('action', 'delete').order('changed_at', { ascending:false }).limit(100)),
    restoreRow: (table, row) => q(sb.from(table).insert(row).select().single()),
    notifications: uid => q(sb.from('notifications').select('*').eq('user_id', uid).order('created_at', { ascending:false }).limit(60)),
    markRead: ids => q(sb.from('notifications').update({ read:true }).in('id', ids)),
    comments: (table, rowId) => q(sb.from('comments').select('*').eq('table_name', table).eq('row_id', rowId).order('created_at')),
    addComment: (project_id, table_name, row_id, body) => q(sb.from('comments').insert({ project_id, table_name, row_id, body }).select().single()),
    deleteComment: id => q(sb.from('comments').delete().eq('id', id)),
    async myWork(uid) {
      const safe = p => q(p).catch(e => { console.warn(e); return []; });
      const [speakers, sessions, secret, tasks] = await Promise.all([
        safe(sb.from('speakers').select('id,project_id,name,grp,done,priority,flight_status,hotel_status,updated_at').contains('assignees', [uid])),
        safe(sb.from('sessions').select('id,project_id,name,day,start_time,end_time,updated_at').contains('assignees', [uid])),
        safe(sb.from('secret_items').select('id,project_id,name,updated_at').contains('assignees', [uid])),
        safe(sb.from('tasks').select('id,project_id,title,status,due_date,priority,updated_at').eq('assignee_id', uid)),
      ]);
      return { speakers, sessions, secret, tasks };
    },
    subscribeUser(uid, cb) {
      const ch = sb.channel('user-' + uid)
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'notifications', filter:`user_id=eq.${uid}` }, p => cb('notif', p))
        .subscribe();
      return () => sb.removeChannel(ch);
    },
    // ---- 연사 마스터 ----
    nationalities: () => q(sb.from('nationalities').select('*').order('sort_order').order('created_at')),
    addNationality: (name, color, sort_order) => q(sb.from('nationalities').insert({ name, color, sort_order }).select().single()),
    speakers: pid => q(sb.from('speakers').select('*').eq('project_id', pid).order('position')),
    createSpeaker: s => q(sb.from('speakers').insert(s).select().single()),
    updateSpeaker: (id, patch) => q(sb.from('speakers').update(patch).eq('id', id).select('id,updated_at').single()),
    deleteSpeaker: id => q(sb.from('speakers').delete().eq('id', id)),
    links: sid => q(sb.from('speaker_links').select('*').eq('speaker_id', sid).order('created_at')),
    addLink: (speaker_id, target_type, target_id) => q(sb.from('speaker_links').insert({ speaker_id, target_type, target_id }).select().single()),
    removeLink: id => q(sb.from('speaker_links').delete().eq('id', id)),
    async resolveTargets({ speaker = [], task = [] }) {
      // 보안 규칙 때문에 내가 속한 프로젝트의 항목만 돌아옵니다
      const [a, b] = await Promise.all([
        speaker.length ? q(sb.from('speakers').select('id,name,project_id').in('id', speaker)) : [],
        task.length ? q(sb.from('tasks').select('id,title,project_id').in('id', task)) : [],
      ]);
      return [...a.map(x => ({ type:'speaker', id:x.id, title:x.name, project_id:x.project_id })),
              ...b.map(x => ({ type:'task', id:x.id, title:x.title, project_id:x.project_id }))];
    },
    async searchTargets(term) {
      const like = `%${term.replace(/[%_\\]/g, m => '\\' + m)}%`;
      let s1 = sb.from('speakers').select('id,name,project_id').order('updated_at', { ascending:false }).limit(40);
      let s2 = sb.from('tasks').select('id,title,project_id').order('updated_at', { ascending:false }).limit(40);
      if (term) { s1 = s1.ilike('name', like); s2 = s2.ilike('title', like); }
      const [a, b] = await Promise.all([q(s1), q(s2).catch(() => [])]);
      return [...a.map(x => ({ type:'speaker', id:x.id, title:x.name, project_id:x.project_id })),
              ...b.map(x => ({ type:'task', id:x.id, title:x.title, project_id:x.project_id }))];
    },
    uploadFile: (path, file, contentType, bucket = 'speaker-files') => q(sb.storage.from(bucket).upload(path, file, { contentType, upsert:false })),
    async fileUrl(path, bucket = 'speaker-files', download) { const d = await q(sb.storage.from(bucket).createSignedUrl(path, 3600, download ? { download } : undefined)); return d.signedUrl; },
    removeFiles: (paths, bucket = 'speaker-files') => q(sb.storage.from(bucket).remove(paths)),
    // ---- 공식 행사 일시·장소 ----
    eventInfo: pid => q(sb.from('speaker_event_info').select('*').eq('project_id', pid)),
    saveEventInfo: (project_id, ev, patch) => q(sb.from('speaker_event_info').upsert({ project_id, ev, ...patch, updated_at: new Date().toISOString() }, { onConflict:'project_id,ev' })),
    async sessionsForSpeakers(ids) {
      const rows = [];
      for (let i = 0; i < ids.length; i += 80) rows.push(...await q(sb.from('session_people').select('session_id,speaker_id,role').in('speaker_id', ids.slice(i, i + 80))));
      if (!rows.length) return { rows, sessions: [], venues: [] };
      const sids = [...new Set(rows.map(r => r.session_id))];
      const sessions = await q(sb.from('sessions').select('id,name,project_id,day,start_time,end_time,venue_id').in('id', sids));
      const vids = [...new Set(sessions.map(x => x.venue_id).filter(Boolean))];
      const venues = vids.length ? await q(sb.from('session_venues').select('id,name,color').in('id', vids)) : [];
      return { rows, sessions, venues };
    },
    // ---- 세션 마스터 ----
    sessions: pid => q(sb.from('sessions').select('*').eq('project_id', pid).order('position')),
    createSession: s => q(sb.from('sessions').insert(s).select().single()),
    updateSession: (id, patch) => q(sb.from('sessions').update(patch).eq('id', id).select('id,updated_at').single()),
    deleteSession: id => q(sb.from('sessions').delete().eq('id', id)),
    opts: (table, pid) => q(sb.from(table).select('*').eq('project_id', pid).order('sort_order').order('created_at')),
    optCreate: (table, row) => q(sb.from(table).insert(row).select().single()),
    optUpdate: (table, id, patch) => q(sb.from(table).update(patch).eq('id', id)),
    optDelete: (table, id) => q(sb.from(table).delete().eq('id', id)),
    async sessionPeopleFor(ids) {
      const out = [];
      for (let i = 0; i < ids.length; i += 80) out.push(...await q(sb.from('session_people').select('*').in('session_id', ids.slice(i, i + 80)).order('position')));
      return out;
    },
    async speakerDetails(ids) {
      const out = [];
      for (let i = 0; i < ids.length; i += 80) out.push(...await q(sb.from('speakers').select('id,name,passport_name,title_en,affil_en,title_ko,affil_ko').in('id', ids.slice(i, i + 80))));
      return out;
    },
    addSessionPerson: (session_id, speaker_id, role) => q(sb.from('session_people').insert({ session_id, speaker_id, role, position: Date.now() }).select().single()),
    removeSessionPerson: id => q(sb.from('session_people').delete().eq('id', id)),
    async searchSpeakers(term, pids) {
      if (!pids.length) return [];
      let qq = sb.from('speakers').select('id,name,passport_name,project_id').in('project_id', pids).order('name').limit(60);
      const t = term.replace(/[,()"%_\\*]/g, ' ').trim();
      if (t) qq = qq.or(`name.ilike."%${t}%",passport_name.ilike."%${t}%"`);
      return q(qq);
    },
    async speakerSessions(speakerId) {
      const rows = await q(sb.from('session_people').select('id,session_id,role').eq('speaker_id', speakerId));
      if (!rows.length) return [];
      const ss = await q(sb.from('sessions').select('id,name,project_id,day,start_time,end_time').in('id', [...new Set(rows.map(r => r.session_id))]));
      return rows.map(r => ({ ...r, session: ss.find(x => x.id === r.session_id) })).filter(r => r.session);
    },
    subscribe(pid, cb) {

function avatar(p, size = 28) {
  if (!p) return `<span class="av" style="width:${size}px;height:${size}px;background:#cbd5e1;font-size:${Math.round(size*.42)}px">?</span>`;
  const n = (p.full_name || p.email || '?').trim();
  const h = [...String(p.id)].reduce((a, c) => a + c.charCodeAt(0), 0);
  return `<span class="av" title="${esc(n)}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;background:${AVC[h % AVC.length]}">${esc(n[0].toUpperCase())}</span>`;
}

let booted = false;

const CAME_FROM_RECOVERY = /type=recovery/.test(location.hash);
let needPassword = false;

async function start() {
  if (DEMO) { $('#demoBanner').classList.remove('hidden'); return boot(await api.getUser()); }
  api.onAuth((ev, session) => {
    if (ev === 'SIGNED_OUT') return location.replace(REDIRECT);
    if (ev === 'PASSWORD_RECOVERY') { needPassword = true; if (booted) passwordModal(true); }
    if (session?.user) boot(session.user);
  });
  const user = await api.getUser();
  if (user) boot(user); else { showLogin(); if (LINK_ERROR) loginMsg(LINK_ERROR, 'var(--danger)'); }
}
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }

async function boot(user) {
  if (booted) return; booted = true;
  try {
    S.me = await api.profile(user.id);
    await reloadMeta();
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    try { S.nats = await api.nationalities(); } catch (_) { S.nats = []; }
    const wanted = new URLSearchParams(location.search).get('project');
    if (location.hash.includes('access_token')) history.replaceState(null, '', REDIRECT + location.search);
    renderPeople();
    loadNotifs(); loadMyWork();
    try { unsubUser = api.subscribeUser(S.me.id, onUserRT); } catch (e) { console.warn(e); }
    const first = (wanted && isMember(wanted)) ? wanted : myProjects()[0]?.id;
    if (wanted && !isMember(wanted)) toast('그 프로젝트에 초대받지 않아 열 수 없어요', true);
    const qp = new URLSearchParams(location.search), wantSp = qp.get('sp'), wantSe = qp.get('se');
    if (qp.get('full') === '1') document.body.classList.add('page-full');
    if (first) openProject(first).then(() => { if (S.pid !== first) return; if (wantSp && spOf(wantSp)) openSpPage(wantSp); else if (wantSe && seOf(wantSe)) openSePage(wantSe); });
    else { renderAll(); }
    // 처음 초대받아 들어온 사람(비밀번호 없음) 또는 재설정 링크 → 비밀번호 설정 창
    if (user.user_metadata?.must_change_password) passwordModal(true, '관리자가 정해 준 임시 비밀번호로 로그인했어요. 앞으로 쓸 새 비밀번호를 정해 주세요.');
    else if (needPassword || CAME_FROM_RECOVERY || user.user_metadata?.password_set !== true) passwordModal(true);
  } catch (e) {
    booted = false; console.error(e); showLogin();
    const m = e.message || String(e);
    loginMsg(/0 rows|no rows|multiple \(or no\)/i.test(m)
      ? '비밀번호는 맞지만 프로필이 없어요. SQL Editor에서 프로필 보정 SQL(1번)을 실행해 주세요.'
      : '로그인 후 데이터를 불러오지 못했어요: ' + m, 'var(--danger)');
  }
}

async function reloadMeta() {
  [S.profiles, S.projects, S.members] = await Promise.all([api.profiles(), api.projects(), api.members()]);
  S.me = prof(S.me.id) || S.me;
}

function loginMsg(text, color) { const m = $('#loginMsg'); m.style.color = color || 'var(--muted)'; m.textContent = text; }

async function handleLogin(e) {
  e.preventDefault();
  const email = $('#loginEmail').value.trim().toLowerCase();
  const pw = $('#loginPw').value.trim();
  const btn = $('#loginForm button');
  btn.disabled = true; loginMsg('로그인 중…');
  try {
    const user = await api.signIn(email, pw);
    loginMsg('');
    boot(user);
  } catch (er) {
    console.error(er);
    const m = er.message || String(er);
    loginMsg(/failed to fetch|network/i.test(m) ? 'Supabase 서버에 연결하지 못했어요. 인터넷 연결이나 Project URL을 확인해 주세요.'
      : /invalid login/i.test(m) ? '이메일 또는 비밀번호가 맞지 않아요. 관리자에게 받은 임시 비밀번호라면 대소문자·띄어쓰기까지 그대로 입력해 주세요. 계속 안 되면 관리자에게 임시 비밀번호를 다시 정해 달라고 하세요.'
      : /not confirmed/i.test(m) ? '계정 인증이 아직 안 됐어요. 관리자에게 임시 비밀번호를 다시 정해 달라고 하세요 (그러면 인증도 같이 처리돼요).'
      : /rate|security purposes/i.test(m) ? '시도가 너무 잦아요. 잠시 후 다시 시도하세요.' : m, 'var(--danger)');
  } finally { btn.disabled = false; }
}

async function handleForgot() {
  const email = $('#loginEmail').value.trim().toLowerCase();
  if (!EMAIL_RE.test(email)) return loginMsg('위 칸에 이메일을 먼저 입력한 뒤 다시 눌러 주세요.', 'var(--danger)');
  loginMsg('보내는 중…');
  try {
    await api.sendReset(email);
    loginMsg(`${email} 메일함을 확인하세요. 링크를 누르면 새 비밀번호를 정할 수 있어요.`, 'var(--ok)');
  } catch (er) {
    loginMsg(/rate|security purposes/i.test(er.message || '') ? '요청이 너무 잦아요. 잠시 후 다시 시도하세요.' : er.message, 'var(--danger)');
  }
}

// 비밀번호 설정/변경 창 (required=true 이면 닫을 수 없음)
function passwordModal(required, note) {
  openModal(`<h3>${required ? '비밀번호 설정' : '비밀번호 변경'}</h3>
    <p class="sub">${note ? esc(note) + '<br>' : ''}${required ? '다음부터는 이메일과 이 비밀번호로 바로 로그인할 수 있어요.' : '새 비밀번호를 입력하세요.'}</p>
    <label class="lbl">새 비밀번호 <span class="hint">8자 이상</span></label>
    <input type="password" id="pw1" autocomplete="new-password" style="width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:9px">
    <label class="lbl">한 번 더 입력</label>
    <input type="password" id="pw2" autocomplete="new-password" style="width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:9px">
    <div class="modal-foot">${required ? '' : '<button class="btn" data-act="closeModal">취소</button>'}<button class="btn-primary" id="pwSave">저장</button></div>`, required);
  setTimeout(() => $('#pw1')?.focus(), 40);
  const save = async () => {
    const a = $('#pw1').value, b = $('#pw2').value;
    if (a.length < 8) return toast('비밀번호는 8자 이상으로 정해 주세요', true);
    if (a !== b) return toast('두 비밀번호가 서로 달라요', true);
    $('#pwSave').disabled = true;
    try { await api.setPassword(a); needPassword = false; closeModal(true); toast('비밀번호를 저장했어요'); }
    catch (e) {
      $('#pwSave').disabled = false;
      toast(/different from the old/i.test(e.message || '') ? '이전과 다른 비밀번호를 입력하세요' : (e.message || '저장하지 못했어요'), true);
    }
  };
  $('#pwSave').onclick = save;
  $('#pw2').onkeydown = e => { if (e.key === 'Enter') save(); };
}
